<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../assets/jcr-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Onboarding de clientes · Portal JCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script>
<script src="onboarding-core.js"></script>
<script src="../societario/societario-core.js"></script>
<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:#2a2f42; --border2:#363d55;
  --text:#e8eaf2; --text2:#9aa1b8; --text3:#626a85;
  --accent:#f87171; --accent2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#60a5fa}
main{max-width:1280px;margin:0 auto;padding:24px 24px 90px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.head h1{font:800 22px Syne,sans-serif}
.head p{color:var(--text2);font-size:13px;margin-top:2px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumbs{font-size:12.5px;color:var(--text3);margin-bottom:10px}.crumbs a{color:var(--text2);text-decoration:none}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f87171,#f59e0b);color:#fff;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn.ok{background:linear-gradient(135deg,#10b981,#14b8a6)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--ok)}
textarea{min-height:80px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{font:700 12px Syne,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.help{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.45}
.muted{color:var(--text3);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi .v{font:800 20px Syne,sans-serif}.kpi .l{font-size:12px;color:var(--text2)}
.funil{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:120px}
.col h4{font:700 12px Syne,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.col h4 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.op{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.op:hover{border-color:var(--border2)}
.op b{display:block;font-size:13.5px}.op .m{font-size:12px;color:var(--text2);margin-top:2px}
.bar{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.badge{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.passos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.passo{border:1px solid var(--border2);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600;color:var(--text2);font-size:13px}
.passo.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.passo.ok::before{content:'✓ ';color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.aviso{padding:10px 12px;border-radius:10px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.aviso b{color:var(--warn)}
.okbox{padding:10px 12px;border-radius:10px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);font-size:13px;margin-bottom:10px}
.folha{background:#fff;color:#111;border-radius:10px;padding:34px 40px;font:13px/1.55 Arial,sans-serif;max-height:640px;overflow:auto}
.folha .titulo{text-align:center;font-weight:700;font-size:15px;margin-bottom:4px}
.folha .centro{text-align:center;margin-bottom:14px}
.folha .secao{font-weight:700;margin-top:12px}
.folha p{margin-bottom:8px;text-align:justify}
.folha .item{margin:0 0 3px 18px}
.folha table{border-collapse:collapse;margin:6px 0 10px}.folha td{border:1px solid #bbb;padding:4px 8px;color:#111}
.folha .ass{text-align:center;margin-top:34px}
.folha .falta{color:#c00000;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border)}
.chk:last-child{border-bottom:0}
.chk .t{flex:1}.chk.feito .t{color:var(--text3);text-decoration:line-through}
.chk a{font-size:12px;white-space:nowrap}
.servs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.servs label{display:flex;gap:7px;align-items:center;margin:0;color:var(--text);font-weight:500}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;background:var(--surface3);border:1px solid var(--border2);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;max-width:380px}
.toast.err{border-left-color:var(--danger)}
.salvo{font-size:12px;color:var(--text3)}
@media (max-width:860px){ main{padding:16px 16px 90px} .g2,.g3,.g4{grid-template-columns:1fr} }
</style>
</head>
<body>
<main id="view"><div class="card">Carregando…</div></main>

<script>
const SUPABASE_URL = 'https://onecnoicxqjhgolqncjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_paOFHdYEcMr7MZdOFx16Lw_sXt0n0-9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const O = window.Onboarding, SO = window.Societario;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => { const s = String(v ?? '').trim().replace(/\s|R\$/g, ''); if (!s) return 0; return +(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dataBR = s => (s ? s.split('-').reverse().join('/') : '—');
const chk = e => { if (e) throw new Error(e.message); };
function toast(msg, erro) { const t = document.createElement('div'); t.className = 'toast' + (erro ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 6000 : 3000); }
const ETAPA = Object.fromEntries(O.ETAPAS.map(e => [e.id, e]));
const ORDEM = O.ETAPAS.map(e => e.id);

const S = { ops: [], cfg: { escritorio: {}, precos: O.PRECOS_PADRAO, textos: {} }, escritorios: [], clientes: [], view: 'funil', op: null, passo: 'qualificacao', timer: null };

// ═════════════ dados ═════════════
async function carregar() {
  const [o, c, e, cl] = await Promise.all([
    sb.from('com_oportunidades').select('*').order('updated_at', { ascending: false }).limit(2000),
    sb.from('com_config').select('*').maybeSingle(),
    sb.from('gclik_escritorios').select('id,nome').order('nome'),
    sb.from('gclik_clientes').select('id,razao_social,cnpj').limit(5000),
  ]);
  chk(o.error); chk(e.error); chk(cl.error);
  S.ops = o.data || []; S.escritorios = e.data || []; S.clientes = cl.data || [];
  if (c.data) S.cfg = { ...c.data, precos: O.mesclar(c.data.precos) };
}
const cfgDoc = () => ({ escritorio: S.cfg.escritorio || {}, precos: S.cfg.precos, textos: S.cfg.textos || {} });

function getP(obj, caminho) { return caminho.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setP(obj, caminho, v) { const ks = caminho.split('.'); let o = obj; ks.slice(0, -1).forEach(k => { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = v; }

function salvarDepois() {
  $('salvo') && ($('salvo').textContent = 'salvando…');
  clearTimeout(S.timer); S.timer = setTimeout(salvarOp, 900);
}
async function salvarOp() {
  const op = S.op; if (!op) return;
  clearTimeout(S.timer);
  op.orcamento = O.calcularOrcamento(S.cfg.precos, op.dados);
  const linha = { nome: op.dados.nome || 'Sem nome', etapa: op.etapa, dados: op.dados, orcamento: op.orcamento, contrato: op.contrato, checklist: op.checklist,
    historico: op.historico, cliente_id: op.cliente_id, soc_processo_id: op.soc_processo_id, data_proposta: op.data_proposta || null, perdido_motivo: op.perdido_motivo || null, updated_at: new Date().toISOString() };
  const r = op.id ? await sb.from('com_oportunidades').update(linha).eq('id', op.id).select().single() : await sb.from('com_oportunidades').insert(linha).select().single();
  if (r.error) { toast('Não salvou: ' + r.error.message, true); return; }
  if (!op.id) { op.id = r.data.id; S.ops.unshift(op); }
  $('salvo') && ($('salvo').textContent = 'salvo ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
}
function mudarEtapa(etapa, nota) {
  const op = S.op; if (op.etapa === etapa) return;
  op.historico = (op.historico || []).concat({ de: op.etapa, para: etapa, em: new Date().toISOString(), nota: nota || null });
  op.etapa = etapa;
}
// Avança só para a frente (não volta uma oportunidade já adiantada)
function avancar(etapa) { if (ORDEM.indexOf(etapa) > ORDEM.indexOf(S.op.etapa) || S.op.etapa === 'perdido') mudarEtapa(etapa); }
function marcar(id, valor = hojeISO()) { S.op.checklist = { ...(S.op.checklist || {}), [id]: valor }; }

// ═════════════ funil ═════════════
function telaFunil() {
  S.view = 'funil'; S.op = null; history.replaceState(null, '', location.pathname);
  const abertas = S.ops.filter(o => !['ativo', 'perdido'].includes(o.etapa));
  const mes = hojeISO().slice(0, 7);
  const ganhos = S.ops.filter(o => o.etapa === 'ativo' || o.etapa === 'implantacao').filter(o => (o.historico || []).some(h => ['implantacao', 'ativo'].includes(h.para) && h.em.slice(0, 7) === mes));
  const emProposta = S.ops.filter(o => ['proposta', 'contrato'].includes(o.etapa)).reduce((s, o) => s + ((o.orcamento && o.orcamento.mensal) || 0), 0);
  const semPreco = !Object.values(S.cfg.precos.base || {}).some(v => +v);
  const dias = o => Math.floor((Date.now() - new Date(o.updated_at || o.created_at).getTime()) / 864e5);
  $('view').innerHTML = `
    <div class="crumbs"><a href="../index.html">Portal</a> › <a href="../index.html#/comercial">Comercial e Atendimento</a> › Onboarding</div>
    <div class="head"><div><h1>🎯 Onboarding de clientes</h1><p>Do orçamento ao cliente implantado: proposta, contrato, cadastro no portal, boas-vindas e checklist.</p></div>
      <div class="acts"><button class="btn sec" onclick="telaConfig()">⚙️ Tabela de preços e escritório</button><button class="btn" onclick="novaOp()">+ Nova oportunidade</button></div></div>
    ${semPreco ? '<div class="aviso"><b>Configure a tabela de preços</b> antes do primeiro orçamento (botão "Tabela de preços e escritório"). Ela também guarda os dados do escritório que vão na proposta e no contrato.</div>' : ''}
    <div class="kpis">
      <div class="kpi"><div class="v">${abertas.length}</div><div class="l">Oportunidades abertas</div></div>
      <div class="kpi"><div class="v">${brl(emProposta)}</div><div class="l">Mensal em proposta/contrato</div></div>
      <div class="kpi"><div class="v">${ganhos.length}</div><div class="l">Fechados neste mês</div></div>
      <div class="kpi"><div class="v">${S.ops.filter(o => o.etapa === 'implantacao').length}</div><div class="l">Em implantação</div></div>
    </div>
    <div class="funil">${O.ETAPAS.map(e => {
      const lista = S.ops.filter(o => o.etapa === e.id);
      return `<div class="col"><h4><i style="background:${e.cor}"></i>${esc(e.nome)} <span class="muted">${lista.length}</span></h4>
        ${lista.map(o => { const pr = O.progresso(o); return `<div class="op" onclick="abrirOp('${o.id}')"><b>${esc(o.nome)}</b>
          <div class="m">${esc((o.dados && o.dados.regime) || 'regime?')}${o.orcamento && o.orcamento.mensal ? ' · ' + brl(o.orcamento.mensal) + '/mês' : ''}</div>
          <div class="m">${dias(o) ? `parada há ${dias(o)} dia(s)` : 'hoje'}${o.etapa === 'perdido' && o.perdido_motivo ? ' · ' + esc(o.perdido_motivo) : ''}</div>
          ${o.etapa === 'implantacao' ? `<div class="bar"><i style="width:${pr.pct}%"></i></div><div class="m">${pr.feitos}/${pr.total} itens</div>` : ''}</div>`; }).join('') || '<div class="muted">—</div>'}</div>`;
    }).join('')}</div>`;
}

function novaOp() {
  S.op = { id: null, nome: '', etapa: 'lead', dados: { uf: 'SP', origem_contabil: 'outro_contador', societario: 'nao', atividade: 'servicos', servicos: [], dia_vencimento: 10, responsavel: S.cfg.escritorio.responsavel || '' },
    contrato: {}, checklist: {}, historico: [], cliente_id: null, soc_processo_id: null };
  S.passo = 'qualificacao'; telaOp();
}
function abrirOp(id) {
  const o = S.ops.find(x => x.id === id); if (!o) return telaFunil();
  S.op = o; o.dados = o.dados || {}; o.contrato = o.contrato || {}; o.checklist = o.checklist || {};
  S.passo = { lead: 'qualificacao', orcamento: 'orcamento', proposta: 'proposta', contrato: 'contrato', implantacao: 'checklist', ativo: 'checklist', perdido: 'qualificacao' }[o.etapa] || 'qualificacao';
  history.replaceState(null, '', '?op=' + id); telaOp();
}

// ═════════════ oportunidade ═════════════
const PASSOS = [['qualificacao', '1 Qualificação'], ['orcamento', '2 Orçamento'], ['proposta', '3 Proposta'], ['contrato', '4 Contrato'], ['cadastro', '5 Cadastro no portal'], ['boasvindas', '6 Boas-vindas'], ['checklist', '7 Checklist']];
function passoFeito(p) {
  const o = S.op, c = o.checklist || {};
  return { qualificacao: !O.faltando(o, 'orcamento').length, orcamento: !!(o.orcamento && o.orcamento.mensal), proposta: !!c.proposta_aceita, contrato: !!c.contrato_assinado,
    cadastro: !!(c.cad_gestao && c.cad_entregas), boasvindas: !!c.bv_email, checklist: O.progresso(o).pct === 100 }[p];
}

function telaOp() {
  S.view = 'op';
  const o = S.op, e = ETAPA[o.etapa];
  $('view').innerHTML = `
    <div class="crumbs"><a href="../index.html">Portal</a> › <a href="#" onclick="telaFunil();return false">Onboarding</a> › ${esc(o.dados.nome || 'Nova oportunidade')}</div>
    <div class="head"><div><h1>${esc(o.dados.nome || 'Nova oportunidade')} <span class="badge" style="--c:${e.cor}">${esc(e.nome)}</span></h1>
      <p><span id="salvo" class="salvo">${o.id ? 'salvo' : 'ainda não salvo'}</span>${o.cliente_id ? ' · <a href="../gclik.html">cliente no Gestão Fiscal</a>' : ''}</p></div>
      <div class="acts">
        <select style="width:auto" onchange="mudarEtapa(this.value);salvarOp().then(telaOp)">${O.ETAPAS.map(x => `<option value="${x.id}" ${x.id === o.etapa ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select>
        ${o.etapa !== 'perdido' ? '<button class="btn sec" onclick="perder()">Marcar como perdido</button>' : ''}
        ${o.id && !o.cliente_id ? '<button class="btn sec" onclick="excluirOp()">Excluir</button>' : ''}
        <button class="btn sec" onclick="salvarOp().then(()=>telaFunil())">← Funil</button></div></div>
    <div class="passos">${PASSOS.map(([k, n]) => `<button class="passo ${S.passo === k ? 'on' : ''} ${passoFeito(k) ? 'ok' : ''}" onclick="irPasso('${k}')">${n}</button>`).join('')}</div>
    <div id="passo"></div>`;
  ({ qualificacao: pQualificacao, orcamento: pOrcamento, proposta: pProposta, contrato: pContrato, cadastro: pCadastro, boasvindas: pBoasVindas, checklist: pChecklist })[S.passo]();
}
function irPasso(k) { S.passo = k; telaOp(); }

// Campo ligado a um caminho da oportunidade (dados.*, contrato.*)
function campo(caminho, rotulo, o = {}) {
  const v = getP(S.op, caminho) ?? '';
  const ev = `onchange="mudou('${caminho}', this${o.numero ? ', 1' : ''})"${o.tipo === 'textarea' || o.vivo ? ` oninput="mudou('${caminho}', this${o.numero ? ', 1' : ''})"` : ''}`;
  let inp;
  if (o.opcoes) inp = `<select ${ev}>${o.opcoes.map(([val, txt]) => `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select>`;
  else if (o.tipo === 'textarea') inp = `<textarea ${ev}>${esc(v)}</textarea>`;
  else inp = `<input type="${o.tipo || 'text'}" value="${esc(v)}" placeholder="${esc(o.ph || '')}" ${o.numero ? 'inputmode="decimal"' : ''} ${ev}>`;
  return `<div class="${o.cls || ''}"><label>${esc(rotulo)}</label>${inp}${o.help ? `<div class="help">${esc(o.help)}</div>` : ''}</div>`;
}
function mudou(caminho, el, numero) {
  setP(S.op, caminho, numero ? num(el.value) : el.value);
  if (caminho === 'dados.nome') S.op.nome = el.value;
  salvarDepois();
  if (['orcamento'].includes(S.passo)) pOrcamento(true);
}

function pQualificacao() {
  const d = S.op.dados;
  $('passo').innerHTML = `
    <div class="card"><h3>Cliente</h3><div class="g g4">
      ${campo('dados.nome', 'Razão social / nome', { cls: '', vivo: true })}${campo('dados.fantasia', 'Nome fantasia')}${campo('dados.documento', 'CNPJ ou CPF', { ph: '00.000.000/0000-00' })}
      ${campo('dados.responsavel', 'Responsável no escritório')}
      ${campo('dados.contato', 'Contato (nome)')}${campo('dados.email', 'E-mail')}${campo('dados.whatsapp', 'WhatsApp', { ph: '(19) 99999-9999' })}
      ${campo('dados.origem', 'Como chegou', { opcoes: [['', '—'], ['indicacao', 'Indicação'], ['whatsapp', 'WhatsApp'], ['site', 'Site/Google'], ['redes', 'Redes sociais'], ['outro', 'Outro']] })}
      ${campo('dados.endereco', 'Endereço completo da empresa', { cls: '' })}${campo('dados.cidade', 'Cidade')}${campo('dados.uf', 'UF')}
      ${campo('dados.representante', 'Representante legal (assina o contrato)')}${campo('dados.representante_cpf', 'CPF do representante')}
    </div></div>
    <div class="card"><h3>Perfil para o orçamento</h3><div class="g g4">
      ${campo('dados.origem_contabil', 'Situação hoje', { opcoes: [['outro_contador', 'Tem contador (troca)'], ['empresa_nova', 'Empresa nova'], ['sem_contador', 'Sem contador / MEI por conta']] })}
      ${campo('dados.societario', 'Precisa de serviço na Junta?', { opcoes: [['nao', 'Não'], ['abertura', 'Abertura de empresa'], ['transformacao', 'Transformação (MEI/EI → LTDA)'], ['alteracao', 'Alteração contratual']] })}

const partesHtml = partes => (partes || []).map(p => (typeof p === 'string' ? esc(p) : `<span class="falta">[${esc(p.falta)}]</span>`)).join('');
function previa(blocos) {
  return `<div class="folha">${blocos.map(x => {
    if (x.tipo === 'tabela') return `<table>${x.linhas.map((l, i) => `<tr>${l.map(c => `<td style="${i === 0 || i === x.linhas.length - 1 ? 'font-weight:700' : ''}">${partesHtml([c])}</td>`).join('')}</tr>`).join('')}</table>`;
    if (x.tipo === 'assinatura') return `<div class="ass">_____________________________________<br><b>${partesHtml(x.partes)}</b><br>${esc(x.cargo || '')}</div>`;
    return `<p class="${{ titulo: 'titulo', centro: 'centro', secao: 'secao', item: 'item' }[x.tipo] || ''}">${x.tipo === 'item' ? '• ' : ''}${partesHtml(x.partes)}</p>`;
  }).join('')}</div>`;
}
const faltas = blocos => blocos.flatMap(b => (b.partes || []).concat(...(b.linhas || []))).filter(p => p && typeof p === 'object').map(p => p.falta);
async function baixarWord(blocos, arquivo) {
  if (!window.docx) return toast('Não foi possível carregar o gerador de Word. Recarregue a página.', true);
  const D = window.docx, just = D.AlignmentType.JUSTIFIED, centro = D.AlignmentType.CENTER;
  const runs = (partes, extra = {}) => (partes || []).map(p => (typeof p === 'string' ? new D.TextRun({ text: p, ...extra }) : new D.TextRun({ text: `[${p.falta}]`, bold: true, color: 'C00000' })));
  const filhos = [];
  blocos.forEach(x => {
    if (x.tipo === 'tabela') {
      filhos.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: x.linhas.map((l, i) => new D.TableRow({ children: l.map((c, j) => new D.TableCell({
        children: [new D.Paragraph({ alignment: j ? D.AlignmentType.RIGHT : undefined, children: runs([c], { bold: i === 0 || i === x.linhas.length - 1 }) })], margins: { top: 40, bottom: 40, left: 100, right: 100 } })) })) }));
      filhos.push(new D.Paragraph({ text: '' }));
    } else if (x.tipo === 'assinatura') {
      filhos.push(new D.Paragraph({ alignment: centro, spacing: { before: 600 }, children: [new D.TextRun('_____________________________________________')] }));
      filhos.push(new D.Paragraph({ alignment: centro, children: runs(x.partes, { bold: true }) }));
      if (x.cargo) filhos.push(new D.Paragraph({ alignment: centro, children: [new D.TextRun(x.cargo)] }));
    } else {
      const titulo = x.tipo === 'titulo';
      filhos.push(new D.Paragraph({ alignment: titulo || x.tipo === 'centro' ? centro : just, indent: x.tipo === 'item' ? { left: 360 } : undefined,
        spacing: { after: x.tipo === 'item' ? 40 : titulo ? 60 : 140, before: x.tipo === 'secao' ? 200 : 0 },
        children: runs((x.tipo === 'item' ? ['• '] : []).concat(x.partes), { bold: titulo || x.tipo === 'secao', size: titulo ? 26 : undefined }) }));
    }
  });
  const doc = new D.Document({ styles: { default: { document: { run: { font: 'Arial', size: 21 } } } }, sections: [{ properties: { page: { margin: { top: 1134, bottom: 1134, left: 1418, right: 1418 } } }, children: filhos }] });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await D.Packer.toBlob(doc));
  a.download = arquivo.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.]+/g, '_') + '.docx';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  const f = faltas(blocos); toast(f.length ? `Word baixado com ${f.length} campo(s) em vermelho para completar.` : 'Word baixado.');
}

// JCR Entregas: contato, portal do cliente e obrigações ativas do regime (mesma regra da tela Clientes do Entregas)
async function garantirEntregas(clienteId) {
  const d = S.op.dados;
  const atual = await sb.from('ent_clientes').select('*').eq('cliente_id', clienteId).maybeSingle();
  const r = await sb.from('ent_clientes').upsert({ cliente_id: clienteId, contato_nome: d.contato || null, contato_email: d.email || null, whatsapp: d.whatsapp || null,
    portal_token: (atual.data && atual.data.portal_token) || crypto.randomUUID(), portal_ativo: true, updated_at: new Date().toISOString() }, { onConflict: 'cliente_id' }).select().single();
  chk(r.error);
  const ob = await sb.from('ent_obrigacoes').select('id,regimes,ativo').eq('ativo', true); chk(ob.error);
  const regime = d.regime === 'Imune/Isento' ? 'Imune/Isento' : d.regime;
  const ids = (ob.data || []).filter(x => !x.regimes || !x.regimes.length || x.regimes.includes(regime)).map(x => x.id);
  if (ids.length) chk((await sb.from('ent_cliente_obrigacoes').upsert(ids.map(id => ({ cliente_id: clienteId, obrigacao_id: id, responsavel: d.responsavel || null })), { onConflict: 'cliente_id,obrigacao_id', ignoreDuplicates: true })).error);
  marcar('cad_entregas'); marcar('cad_portal');
}

      <p class="help">A lista de pendências sai do checklist (documentos e acessos ainda não recebidos). O modelo do texto fica em "Tabela de preços e escritório → Textos".${S.portal ? '' : ' Para incluir o link do portal do cliente, faça antes o passo 5 (Cadastro).'}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn sec" onclick="window.open(gmail($('bv-para').value,$('bv-assunto').value,$('bv-corpo').value),'_blank')">✉️ Abrir no Gmail</button>
        <button class="btn sec" onclick="location.href='mailto:'+encodeURIComponent($('bv-para').value)+'?subject='+encodeURIComponent($('bv-assunto').value)+'&body='+encodeURIComponent($('bv-corpo').value)">📧 Outro e-mail</button>
        ${d.whatsapp ? `<button class="btn sec" onclick="window.open('https://wa.me/${zap(d.whatsapp)}?text='+encodeURIComponent($('bv-corpo').value),'_blank')">💬 WhatsApp</button>` : ''}
        <button class="btn sec" onclick="navigator.clipboard.writeText($('bv-corpo').value).then(()=>toast('Texto copiado.'))">📋 Copiar</button>
        <span style="flex:1"></span>
        ${S.op.checklist.bv_email ? `<span class="muted" style="align-self:center">Enviado em ${dataBR(S.op.checklist.bv_email)}</span>` : '<button class="btn ok" onclick="bvEnviado()">✓ Marcar como enviado</button>'}
      </div></div>`;
}
async function bvEnviado() { marcar('bv_email'); await salvarOp(); S.passo = 'checklist'; telaOp(); toast('Boas-vindas registradas.'); }

// ── checklist ──
function pChecklist() {
  const o = S.op, grupos = O.checklist(o), pr = O.progresso(o);
  const acao = { proposta: "irPasso('proposta')", contrato: "irPasso('contrato')", cliente: "irPasso('cadastro')", entregas: "irPasso('cadastro')", portal: "irPasso('cadastro')", societario: "irPasso('cadastro')", email: "irPasso('boasvindas')" };
  $('passo').innerHTML = `
    <div class="card"><h3>Implantação — ${pr.feitos} de ${pr.total} (${pr.pct}%)</h3><div class="bar" style="height:8px"><i style="width:${pr.pct}%"></i></div>
      ${pr.pct === 100 && o.etapa !== 'ativo' ? '<div class="okbox" style="margin-top:10px">Tudo feito! <button class="btn ok sm" onclick="concluir()">Concluir onboarding</button></div>' : ''}</div>
    ${grupos.map(g => `<div class="card"><h3>${esc(g.grupo)}</h3>${g.itens.map(i => {
      const feito = (o.checklist || {})[i.id];
      return `<div class="chk ${feito ? 'feito' : ''}"><input type="checkbox" ${feito ? 'checked' : ''} onchange="alternar('${i.id}',this.checked)">
        <span class="t">${esc(i.texto)}${feito ? ` <span class="muted">(${dataBR(feito)})</span>` : ''}</span>
        ${i.auto && acao[i.auto] ? `<a href="#" onclick="${acao[i.auto]};return false">fazer →</a>` : ''}${i.link ? `<a href="../${i.link}">abrir ↗</a>` : ''}</div>`;
    }).join('')}</div>`).join('')}`;
}
async function alternar(id, on) {
  const c = { ...(S.op.checklist || {}) }; if (on) c[id] = hojeISO(); else delete c[id];
  S.op.checklist = c; await salvarOp(); pChecklist(); telaOpCabecalho();
}
function telaOpCabecalho() { document.querySelectorAll('.passo').forEach((b, i) => b.classList.toggle('ok', !!passoFeito(PASSOS[i][0]))); }
async function concluir() { mudarEtapa('ativo'); await salvarOp(); telaOp(); toast('Onboarding concluído. Cliente ativo!'); }
async function perder() {
  const m = prompt('Motivo da perda (preço, foi para outro escritório, desistiu…):'); if (m === null) return;
  S.op.perdido_motivo = m; mudarEtapa('perdido', m); await salvarOp(); telaFunil();
}
async function excluirOp() {
  if (!confirm('Excluir esta oportunidade?')) return;
  const r = await sb.from('com_oportunidades').delete().eq('id', S.op.id);
  if (r.error) return toast(r.error.message, true);
  S.ops = S.ops.filter(x => x.id !== S.op.id); telaFunil();
}

// ═════════════ configuração: escritório, tabela de preços e textos ═════════════
function telaConfig() {
  S.view = 'config';
  const e = S.cfg.escritorio || {}, p = S.cfg.precos, t = S.cfg.textos || {};
  const bv = { ...O.MODELO_BOAS_VINDAS, ...(t.boas_vindas || {}) };
  const rot = { 'MEI': 'MEI', 'Simples Nacional|servicos': 'Simples — serviços', 'Simples Nacional|comercio': 'Simples — comércio/indústria', 'Lucro Presumido|servicos': 'Presumido — serviços', 'Lucro Presumido|comercio': 'Presumido — comércio/indústria', 'Lucro Real': 'Lucro Real', 'Imune/Isento': 'Imune/Isento' };
  const inp = (id, v, o = {}) => `<div><label>${esc(o.rot)}</label><input id="${id}" value="${esc(v ?? '')}" ${o.n ? 'inputmode="decimal"' : ''}></div>`;
  $('view').innerHTML = `
    <div class="crumbs"><a href="../index.html">Portal</a> › <a href="#" onclick="telaFunil();return false">Onboarding</a> › Configuração</div>
    <div class="head"><div><h1>⚙️ Tabela de preços e escritório</h1><p>Vale para todos os orçamentos, propostas e contratos.</p></div>
      <div class="acts"><button class="btn sec" onclick="telaFunil()">Cancelar</button><button class="btn" onclick="salvarConfig()">💾 Salvar</button></div></div>
    <div class="card"><h3>Escritório (sai na proposta e no contrato)</h3><div class="g g4">
      ${inp('e-nome', e.nome, { rot: 'Nome / razão social' })}${inp('e-cnpj', e.cnpj, { rot: 'CNPJ' })}${inp('e-crcemp', e.crc_empresa, { rot: 'CRC do escritório (organização contábil)' })}${inp('e-resp', e.responsavel, { rot: 'Responsável técnico' })}
      ${inp('e-crc', e.crc, { rot: 'CRC do responsável' })}${inp('e-end', e.endereco, { rot: 'Endereço' })}${inp('e-cid', e.cidade, { rot: 'Cidade/UF (foro)' })}${inp('e-zap', e.whatsapp, { rot: 'WhatsApp de atendimento' })}
    </div></div>
    <div class="card"><h3>Honorário base mensal por regime (R$)</h3><div class="g g4">
      ${Object.keys(O.PRECOS_PADRAO.base).map(k => inp('b-' + k.replace(/\W/g, '_'), p.base[k] || '', { rot: rot[k] || k, n: 1 })).join('')}</div></div>
    <div class="card"><h3>Adicionais mensais</h3><div class="g g4">
      ${inp('a-finc', p.funcionarios_inclusos, { rot: 'Funcionários já incluídos na base', n: 1 })}${inp('a-func', p.por_funcionario, { rot: 'Por funcionário além dos incluídos (R$)', n: 1 })}
      ${inp('a-socio', p.por_socio_prolabore, { rot: 'Por sócio com pró-labore (R$)', n: 1 })}${inp('a-filial', p.por_filial, { rot: 'Por filial (R$)', n: 1 })}</div>
      <label style="margin-top:10px">Adicional por volume de notas/documentos no mês</label><div class="g g4">
      ${p.faixas_notas.map((f, i) => `<div><label>${f.ate == null ? 'Acima da última faixa' : 'Até ' + f.ate + ' notas'}</label><input id="fx-${i}" value="${esc(f.valor || '')}" inputmode="decimal"></div>`).join('')}</div></div>
    <div class="card"><h3>Serviços adicionais</h3><table><thead><tr><th>Serviço</th><th>Cobrança</th><th>Valor (R$) ou % de êxito</th></tr></thead><tbody>
      ${p.servicos.map((s, i) => `<tr><td><input id="s-nome-${i}" value="${esc(s.nome)}"></td><td>${{ avulso: 'Valor único', mensal: 'Mensal (soma no honorário)', anual: 'Anual', exito: 'Êxito (%)' }[s.cobranca]}</td>
        <td><input id="s-val-${i}" value="${esc(s.cobranca === 'exito' ? (s.percentual || '') : (s.valor || ''))}" inputmode="decimal"></td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h3>Condições</h3><div class="g g4">
      <div><label>13º honorário em dezembro</label><select id="c-13"><option value="1" ${p.decimo_terceiro ? 'selected' : ''}>Sim</option><option value="0" ${!p.decimo_terceiro ? 'selected' : ''}>Não</option></select></div>
      ${inp('c-indice', p.indice_reajuste, { rot: 'Índice de reajuste anual' })}${inp('c-val', p.validade_dias, { rot: 'Validade da proposta (dias)', n: 1 })}${inp('c-desc', p.desconto_maximo, { rot: 'Desconto máximo (%)', n: 1 })}
      ${inp('c-multa', p.multa_atraso, { rot: 'Multa por atraso (%)', n: 1 })}${inp('c-juros', p.juros_mes, { rot: 'Juros ao mês (%)', n: 1 })}${inp('c-aviso', p.aviso_previo_dias, { rot: 'Aviso prévio da rescisão (dias)', n: 1 })}${inp('c-docs', p.dia_documentos, { rot: 'Dia limite dos documentos', n: 1 })}
    </div></div>
    <div class="card"><h3>Textos</h3>
      <label>Apresentação do escritório (proposta, item 1)</label><textarea id="t-apres">${esc(t.apresentacao || '')}</textarea>
      <div class="g g2" style="margin-top:10px"><div><label>Assunto do e-mail de boas-vindas</label><input id="t-bv-assunto" value="${esc(bv.assunto)}"></div></div>
      <label style="margin-top:10px">Mensagem de boas-vindas</label><textarea id="t-bv-corpo" style="min-height:300px">${esc(bv.corpo)}</textarea>
      <p class="help">Variáveis: {escritorio} {cliente} {contato} {inicio} {dia_documentos} {portal} {vencimento} {responsavel} {canal} {whatsapp_escritorio} {pendencias}</p></div>`;
}
async function salvarConfig() {
  const v = id => ($(id) ? $(id).value.trim() : '');
  const p = JSON.parse(JSON.stringify(S.cfg.precos));
  Object.keys(O.PRECOS_PADRAO.base).forEach(k => { p.base[k] = num(v('b-' + k.replace(/\W/g, '_'))); });
  p.funcionarios_inclusos = num(v('a-finc')); p.por_funcionario = num(v('a-func')); p.por_socio_prolabore = num(v('a-socio')); p.por_filial = num(v('a-filial'));
  p.faixas_notas = p.faixas_notas.map((f, i) => ({ ...f, valor: num(v('fx-' + i)) }));
  p.servicos = p.servicos.map((s, i) => ({ ...s, nome: v('s-nome-' + i) || s.nome, ...(s.cobranca === 'exito' ? { percentual: num(v('s-val-' + i)) } : { valor: num(v('s-val-' + i)) }) }));
  p.decimo_terceiro = v('c-13') === '1'; p.indice_reajuste = v('c-indice') || 'IPCA'; p.validade_dias = num(v('c-val')) || 15; p.desconto_maximo = num(v('c-desc'));
  p.multa_atraso = num(v('c-multa')); p.juros_mes = num(v('c-juros')); p.aviso_previo_dias = num(v('c-aviso')) || 30; p.dia_documentos = num(v('c-docs')) || 5;
  const escritorio = { nome: v('e-nome'), cnpj: v('e-cnpj'), crc_empresa: v('e-crcemp'), responsavel: v('e-resp'), crc: v('e-crc'), endereco: v('e-end'), cidade: v('e-cid'), whatsapp: v('e-zap') };
  const textos = { ...(S.cfg.textos || {}), apresentacao: v('t-apres'), boas_vindas: { assunto: v('t-bv-assunto'), corpo: $('t-bv-corpo').value } };
  const r = await sb.from('com_config').upsert({ escritorio, precos: p, textos, updated_at: new Date().toISOString() }, { onConflict: 'user_id' }).select().single();
  if (r.error) return toast('Não salvou: ' + r.error.message, true);
  S.cfg = { ...r.data, precos: O.mesclar(r.data.precos) }; toast('Configuração salva.'); telaFunil();
}

// ═════════════ início ═════════════
(async () => {
  try {
    await carregar();
    const id = new URLSearchParams(location.search).get('op');
    if (id && S.ops.some(o => o.id === id)) abrirOp(id); else telaFunil();
  } catch (e) { $('view').innerHTML = `<div class="card">Não foi possível carregar: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
