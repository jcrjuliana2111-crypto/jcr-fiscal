<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>JCR Preenchedor</title>
<style>
body{width:380px;margin:0;font:13px/1.45 system-ui,sans-serif;background:#0d0f14;color:#e8eaf2}
header{padding:12px 14px;border-bottom:1px solid #2a2f42;display:flex;gap:8px;align-items:center}
header b{font-size:14px}header span{margin-left:auto;font-size:11.5px;color:#9aa1b8}
main{padding:12px 14px}
label{display:block;font-size:11.5px;font-weight:600;color:#9aa1b8;margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;background:#1a1e2a;border:1px solid #363d55;border-radius:8px;padding:7px 9px;color:#e8eaf2;font:inherit}
.lista{max-height:180px;overflow:auto;border:1px solid #2a2f42;border-radius:8px;margin-top:6px}
.lista div{padding:7px 9px;border-bottom:1px solid #2a2f42;cursor:pointer}.lista div:hover{background:#1a1e2a}
.lista div.on{background:#1f3a33;border-left:3px solid #34d399}
.lista small{display:block;color:#9aa1b8}
button{width:100%;margin-top:12px;border:0;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#10b981,#4f8ef7);color:#fff;font:inherit;font-weight:700}
button.sec{background:#1a1e2a;border:1px solid #363d55}
.aviso{padding:9px 10px;border-radius:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);margin-top:8px}
.ok{padding:9px 10px;border-radius:8px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);margin-top:8px}
.res li{margin:2px 0}.muted{color:#9aa1b8;font-size:11.5px}
.ficha div{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed #2a2f42}
.ficha span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ficha em{color:#9aa1b8;font-style:normal;width:120px;flex:none}
.ficha a{color:#60a5fa;cursor:pointer}
.linha{display:flex;gap:8px;align-items:center;margin-top:8px}.linha input{width:auto}
</style>
</head>
<body>
<header><b>🧾 JCR Preenchedor</b><span id="quem"></span></header>
<main id="tela"></main>
<script src="mapa.js"></script>
<script src="popup.js"></script>
</body>
</html>
