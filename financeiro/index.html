<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../assets/jcr-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Financeiro JCR · Portal JCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="financeiro-core.js"></script>
<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:#2a2f42; --border2:#363d55;
  --text:#e8eaf2; --text2:#9aa1b8; --text3:#626a85;
  --accent:#4f8ef7; --accent2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* ── estrutura ── */
.app{display:flex;min-height:100vh}
.side{width:226px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font:800 15px Syne,sans-serif;color:#fff}
.brand-name{font:800 16px Syne,sans-serif}
.brand-sub{font-size:11px;color:var(--text3)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--text2);font-weight:600;text-align:left;width:100%}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--text3);padding:8px}
main{flex:1;min-width:0;padding:24px 28px 90px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.head h1{font:800 22px Syne,sans-serif}
.head p{color:var(--text2);font-size:13px;margin-top:2px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ── componentes ── */
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6b7ff7);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.sec{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn.ok{background:#059669}
.btn.danger{background:#b91c1c}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;padding:4px 7px;cursor:pointer;color:var(--text2)}
.icon-btn:hover{border-color:var(--border2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.card h2{font:700 11.5px Syne,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.kpi .v{font:800 26px Syne,sans-serif}
.kpi .l{font-size:12px;color:var(--text2);margin-top:2px}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters>*{flex:1 1 150px;max-width:230px}
.filters .grow{max-width:none;flex:2 1 220px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.muted{color:var(--text3);font-size:12px}
.nowrap{white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;background:var(--surface3);color:var(--text2);margin:1px}
.bar{height:8px;border-radius:6px;background:var(--surface3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{padding:34px;text-align:center;color:var(--text3)}
.row-flex{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--border2);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;color:var(--text2);font-size:13px}
.tab.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bulk{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid var(--accent)}

/* ── modal / gaveta ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:620px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.lg{max-width:900px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font:700 16px Syne,sans-serif}
.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.help{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.4}
.checklist{display:grid;gap:4px;max-height:340px;overflow:auto;padding:4px;border:1px solid var(--border);border-radius:10px}
.checklist label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text);margin:0;padding:5px 6px;border-radius:7px;cursor:pointer}
.checklist label:hover{background:var(--surface2)}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;background:var(--surface3);border:1px solid var(--border2);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:380px}
.toast.err{border-left-color:var(--danger)}

/* ── agenda ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;color:var(--text3);text-align:center;text-transform:uppercase}
.day{min-height:88px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;font-size:12px}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.35}
.day.hol{background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.day.today{border-color:var(--accent2)}
.day .n{font-weight:700}
.day .hn{font-size:10.5px;color:var(--warn)}
.day .pill{display:block;margin-top:3px;padding:1px 6px;border-radius:6px;font-size:11px}

/* ── processos ── */
.proc{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border)}
.step.done .t{text-decoration:line-through;color:var(--text3)}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .brand,.side .foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  main{padding:16px 16px 90px}
  .g2,.f2,.f3{grid-template-columns:1fr}
  .day{min-height:60px}
}

/* Financeiro JCR */
.side .foot{padding-bottom:64px}
.num{text-align:right}
th.num{text-align:right}
td.num{font-variant-numeric:tabular-nums}
@media print{
  .side,.acts,.btn,#jcr-portal-pill{display:none!important}
  body,.app,main,.tbl,.card,.kpi{background:#fff!important;color:#000!important;border-color:#ccc!important}
  .muted{color:#555!important}
  td,th{color:#000!important}
}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="view"><div class="empty">Carregando…</div></main>
</div>
<div id="modal-root"></div>

<script>
const SUPABASE_URL = 'https://onecnoicxqjhgolqncjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_paOFHdYEcMr7MZdOFx16Lw_sXt0n0-9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const F = window.Financeiro;
const ESCRITORIO_JCR = 'ca9fb94f-abd6-4d55-bd3e-76170860d0ef'; // receitas: honorários deste escritório no Gestão Fiscal

const PAGINAS = [
  { id: 'pagar', nome: 'Contas a pagar', ic: '📤' },
  { id: 'receber', nome: 'Receitas', ic: '📥' },
  { id: 'fluxo', nome: 'Fluxo de caixa', ic: '📈' },
  { id: 'dre', nome: 'DRE', ic: '📊' },
  { id: 'config', nome: 'Categorias e contas', ic: '⚙️' },
];
const SIT = {
  vencida:   { nome: 'Vencida',   cor: 'var(--danger)' },
  hoje:      { nome: 'Vence hoje', cor: 'var(--orange)' },
  aberto:    { nome: 'Em aberto', cor: 'var(--accent)' },
  pago:      { nome: 'Pago',      cor: 'var(--ok)' },
  cancelado: { nome: 'Cancelado', cor: 'var(--text3)' },
};
const FORMAS = ['PIX', 'Boleto', 'Débito automático', 'Cartão de crédito', 'Transferência', 'Dinheiro'];
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

// ── utilidades ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const semAcento = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => { const s = String(v ?? '').trim().replace(/\s|R\$/g, ''); return +(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
function toast(msg, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), erro ? 6000 : 3000);
}
function chk(error) { if (error) { toast('Erro: ' + error.message, true); throw error; } }
function opts(lista, sel, vazio) {
  return (vazio != null ? `<option value="">${esc(vazio)}</option>` : '') +
    lista.map(o => { const [v, n] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(n)}</option>`; }).join('');
}
function modal(titulo, corpo, rodape, lg) {
  $('modal-root').innerHTML = `<div class="ov" onclick="if(event.target===this)fechar()"><div class="modal ${lg ? 'lg' : ''}">
    <div class="modal-h"><h3>${titulo}</h3><button class="icon-btn x" onclick="fechar()">✕</button></div>
    <div class="modal-b">${corpo}</div>${rodape ? `<div class="modal-f">${rodape}</div>` : ''}</div></div>`;
}
function fechar() { $('modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
const badge = (s, tipo) => `<span class="badge" style="--c:${SIT[s].cor}">${s === 'pago' && tipo === 'receber' ? 'Recebido' : SIT[s].nome}</span>`;

// ── estado ──
const S = {
  categorias: [], catPorId: new Map(), contas: [], lancamentos: [], honorarios: [],
  pagina: 'pagar', ano: +hojeISO().slice(0, 4), regime: 'competencia', abertos: new Set(),
  filtro: { mes: hojeISO().slice(0, 7), sit: 'abertas', cat: '', busca: '' }, sel: new Set(),
};

async function carregar() {
  const q = (t, f) => f(sb.from(t).select('*')).then(r => { chk(r.error); return r.data; });
  const [cat, contas, lanc, hon] = await Promise.all([
    q('fin_categorias', x => x.order('ordem').order('nome')),
    q('fin_contas_bancarias', x => x.order('nome')),
    q('fin_lancamentos', x => x.order('vencimento').limit(10000)),
    q('gclik_honorarios', x => x.eq('escritorio_id', ESCRITORIO_JCR).limit(10000)),
  ]);
  S.categorias = cat; S.catPorId = new Map(cat.map(c => [c.id, c]));
  S.contas = contas; S.lancamentos = lanc; S.honorarios = hon;
}

// Lançamentos + honorários no formato comum do fluxo/DRE
function movimentos() {
  return S.lancamentos.map(l => {
    const c = S.catPorId.get(l.categoria_id);
    return { ...l, valor: +l.valor, valor_pago: l.valor_pago == null ? null : +l.valor_pago,
      grupo_dre: c ? c.grupo_dre : (l.tipo === 'receber' ? 'receita' : 'administrativa'), categoria: c ? c.nome : 'Sem categoria' };
  }).concat(S.honorarios.map(F.deHonorario));
}

// ── navegação ──
function menu() {
  const hoje = hojeISO();
  const vencidas = S.lancamentos.filter(l => l.tipo === 'pagar' && F.situacao(l, hoje) === 'vencida').length;
  $('side').innerHTML = `<div class="brand"><div class="brand-mark">$</div><div><div class="brand-name">Financeiro JCR</div><div class="brand-sub">Contas do escritório</div></div></div>` +
    PAGINAS.map(p => `<button class="nav ${S.pagina === p.id ? 'on' : ''}" onclick="ir('${p.id}')"><span class="ic">${p.ic}</span>${p.nome}${p.id === 'pagar' && vencidas ? `<span class="cnt">${vencidas}</span>` : ''}</button>`).join('') +
    `<div class="foot">Só o financeiro da JCR.<br>Não usa o Conta Azul.</div>`;
}
function ir(p) {
  S.pagina = p; S.sel.clear();
  try { sessionStorage.setItem('fin-pagina', p); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function render() {
  menu();
  ({ pagar: () => vLancamentos('pagar'), receber: () => vLancamentos('receber'), fluxo: vFluxo, dre: vDre, config: vConfig })[S.pagina]();
}

// ════════════ CONTAS A PAGAR / RECEITAS ════════════
// Receitas = honorários da JCR (Gestão Fiscal) + receitas avulsas. Honorário tem id 'h:<id>'.
const HON = '__honorarios';
const ehHon = id => String(id).startsWith('h:');
function honorarioItem(h) {
  return { ...F.deHonorario(h), id: 'h:' + h.id, descricao: h.servico || 'Honorário', categoria_id: HON,
    fornecedor: h.nome_cliente || '', forma: h.forma || null, observacoes: h.obs || null };
}
function itensDoTipo(tipo) {
  const ls = S.lancamentos.filter(l => l.tipo === tipo);
  return tipo === 'receber' ? ls.concat(S.honorarios.map(honorarioItem)) : ls;
}
function itemPorId(id) {
  if (!ehHon(id)) return S.lancamentos.find(x => x.id === id);
  const h = S.honorarios.find(x => x.id === id.slice(2));
  return h && honorarioItem(h);
}
function filtrados(tipo) {
  const f = S.filtro, hoje = hojeISO(), b = semAcento(f.busca);
  return itensDoTipo(tipo).sort((a, b) => a.vencimento.localeCompare(b.vencimento)).filter(l => {
    const sit = F.situacao(l, hoje);
    if (f.sit === 'abertas' && !['aberto', 'hoje', 'vencida'].includes(sit)) return false;
    if (f.sit === 'vencidas' && sit !== 'vencida') return false;
    if (f.sit === 'pagas' && sit !== 'pago') return false;
    // em aberto: mostra também o que venceu antes do mês escolhido
    if (f.mes && !(l.vencimento.startsWith(f.mes) || (f.sit !== 'pagas' && sit === 'vencida' && l.vencimento < f.mes))) return false;
    if (f.cat && l.categoria_id !== f.cat) return false;
    if (b && !semAcento(`${l.descricao} ${l.fornecedor || ''} ${l.observacoes || ''}`).includes(b)) return false;
    return true;
  });
}
function vLancamentos(tipo) {
  const hoje = hojeISO(), pagar = tipo === 'pagar';
  const doTipo = itensDoTipo(tipo);
  const soma = ls => ls.reduce((a, l) => a + (+l.valor || 0), 0);
  const vencidas = doTipo.filter(l => F.situacao(l, hoje) === 'vencida');
  const deHoje = doTipo.filter(l => F.situacao(l, hoje) === 'hoje');
  const em7 = doTipo.filter(l => l.status === 'aberto' && l.vencimento > hoje && (new Date(l.vencimento) - new Date(hoje)) / 864e5 <= 7);
  const pagosMes = doTipo.filter(l => l.status === 'pago' && (l.data_pagamento || '').startsWith(hoje.slice(0, 7)));
  const lista = filtrados(tipo);
  const cats = S.categorias.filter(c => c.tipo === (pagar ? 'despesa' : 'receita'));
  const kpi = (v, l, c, sit) => `<div class="kpi" style="--c:${c}" onclick="S.filtro.sit='${sit}';S.filtro.mes='';render()"><div class="v" style="font-size:20px">${v}</div><div class="l">${l}</div></div>`;
  const marcadas = lista.filter(l => S.sel.has(l.id));

  $('view').innerHTML = `
    <div class="head"><div><h1>${pagar ? 'Contas a pagar' : 'Receitas'}</h1>
      <p>${pagar ? 'Contas do escritório: aluguel, sistemas, impostos, pró-labore…' : 'Honorários da JCR (vêm do Gestão Fiscal) e outras receitas. Ao receber aqui, o honorário fica como Pago também no Gestão Fiscal.'}</p></div>
      <div class="acts"><button class="btn" onclick="mLancamento('${tipo}')">+ ${pagar ? 'Nova conta' : 'Nova receita'}</button></div></div>
    <div class="kpis">
      ${kpi(brl(soma(vencidas)), `${vencidas.length} vencida(s)`, 'var(--danger)', 'vencidas')}
      ${kpi(brl(soma(deHoje)), `${deHoje.length} vence(m) hoje`, 'var(--orange)', 'abertas')}
      ${kpi(brl(soma(em7)), `${em7.length} nos próximos 7 dias`, 'var(--accent)', 'abertas')}
      ${kpi(brl(pagosMes.reduce((a, l) => a + (+(l.valor_pago ?? l.valor) || 0), 0)), `${pagar ? 'Pago' : 'Recebido'} em ${MESES[+hoje.slice(5, 7) - 1]}`, 'var(--ok)', 'pagas')}
    </div>
    <div class="filters">
      <input type="month" value="${S.filtro.mes}" onchange="S.filtro.mes=this.value;render()" title="Mês do vencimento (vazio = todos)" style="width:auto">
      <select onchange="S.filtro.sit=this.value;render()" style="width:auto">${opts([['abertas', 'Em aberto'], ['vencidas', 'Vencidas'], ['pagas', pagar ? 'Pagas' : 'Recebidas'], ['todas', 'Todas']], S.filtro.sit)}</select>
      <select onchange="S.filtro.cat=this.value;render()" style="width:auto">${opts((pagar ? [] : [[HON, 'Honorários (Gestão Fiscal)']]).concat(cats.map(c => [c.id, c.nome])), S.filtro.cat, 'Todas as categorias')}</select>
      <input placeholder="Buscar descrição ou fornecedor…" value="${esc(S.filtro.busca)}" oninput="S.filtro.busca=this.value;clearTimeout(window._bt);window._bt=setTimeout(()=>{render();const i=document.querySelector('.filters input[placeholder]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)" style="flex:1;min-width:200px">

    <div class="tbl"><table><thead><tr>
      <th style="width:30px"><input type="checkbox" ${lista.length && lista.every(l => S.sel.has(l.id)) ? 'checked' : ''} onchange="${lista.map(l => l.id).length ? `marcarTodos(this.checked)` : ''}"></th>
      <th>Vencimento</th><th>${pagar ? 'Conta / fornecedor' : 'Receita'}</th><th>Categoria</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
    ${lista.map(l => {
      const sit = F.situacao(l, hoje), c = S.catPorId.get(l.categoria_id), aberto = ['aberto', 'hoje', 'vencida'].includes(sit);
      return `<tr style="${sit === 'cancelado' ? 'opacity:.5' : ''}">
        <td>${aberto ? `<input type="checkbox" ${S.sel.has(l.id) ? 'checked' : ''} onchange="this.checked?S.sel.add('${l.id}'):S.sel.delete('${l.id}');render()">` : ''}</td>
        <td class="nowrap">${F.fmtData(l.vencimento)}<div class="muted">comp. ${F.fmtComp(l.competencia)}</div></td>
        <td style="cursor:${ehHon(l.id) ? 'default' : 'pointer'}" onclick="${ehHon(l.id) ? '' : `mLancamento('${tipo}','${l.id}')`}"><b>${esc(l.descricao)}</b>${l.parcela ? ` <span class="chip">${esc(l.parcela)}</span>` : ''}<div class="muted">${esc([l.fornecedor, l.forma].filter(Boolean).join(' · '))}</div></td>
        <td>${ehHon(l.id) ? 'Honorários <span class="chip">Gestão Fiscal</span>' : c ? esc(c.nome) : '<span class="muted">—</span>'}</td>
        <td class="num nowrap"><b>${brl(l.valor)}</b>${l.status === 'pago' && l.valor_pago != null && +l.valor_pago !== +l.valor ? `<div class="muted">${pagar ? 'pago' : 'recebido'} ${brl(l.valor_pago)}</div>` : ''}</td>
        <td>${badge(sit, tipo)}${l.status === 'pago' ? `<div class="muted">${F.fmtData(l.data_pagamento)}</div>` : ''}</td>
        <td class="nowrap">${aberto ? `<button class="btn ok sm" onclick="mBaixa(['${l.id}'])">${pagar ? 'Pagar' : 'Receber'}</button>` : l.status === 'pago' ? `<button class="btn sec sm" onclick="estornar('${l.id}')">Estornar</button>` : ''}</td></tr>`;
    }).join('')}
    </tbody></table>${lista.length ? '' : `<div class="empty">${doTipo.length ? 'Nada com esses filtros.' : pagar ? 'Nenhuma conta cadastrada. Comece por "+ Nova conta" (dá para repetir todo mês).' : 'Nenhum honorário da JCR no Gestão Fiscal e nenhuma receita avulsa.'}</div>`}</div>
    ${lista.length ? `<div class="help" style="margin-top:8px">${lista.length} lançamento(s) · total ${brl(soma(lista))}</div>` : ''}`;
}
function marcarTodos(on) {
  const lista = filtrados(S.pagina === 'receber' ? 'receber' : 'pagar').filter(l => ['aberto', 'hoje', 'vencida'].includes(F.situacao(l, hojeISO())));
  lista.forEach(l => on ? S.sel.add(l.id) : S.sel.delete(l.id));
  render();
}

function mLancamento(tipo, id) {
  const pagar = tipo === 'pagar', hoje = hojeISO();
  const l = S.lancamentos.find(x => x.id === id) || { tipo, vencimento: hoje, competencia: hoje.slice(0, 7), status: 'aberto' };
  const cats = S.categorias.filter(c => c.tipo === (pagar ? 'despesa' : 'receita') && (c.ativo || c.id === l.categoria_id));
  const fornecedores = [...new Set(S.lancamentos.map(x => x.fornecedor).filter(Boolean))].sort();
  const doGrupo = l.grupo ? S.lancamentos.filter(x => x.grupo === l.grupo && x.status === 'aberto' && x.vencimento >= l.vencimento && x.id !== l.id).length : 0;
  modal(id ? (pagar ? 'Editar conta' : 'Editar receita') : (pagar ? 'Nova conta a pagar' : 'Nova receita'), `
    <div class="f2"><div><label>Descrição</label><input id="l-desc" value="${esc(l.descricao || '')}" placeholder="${pagar ? 'Ex.: Aluguel da sala' : 'Ex.: Consultoria avulsa'}"></div>
      <div><label>${pagar ? 'Fornecedor' : 'Cliente / pagador'}</label><input id="l-forn" list="dl-forn" value="${esc(l.fornecedor || '')}"><datalist id="dl-forn">${fornecedores.map(f => `<option value="${esc(f)}">`).join('')}</datalist></div></div>
    <div class="f3"><div><label>Valor (R$)</label><input id="l-valor" inputmode="decimal" value="${l.valor != null ? String(l.valor).replace('.', ',') : ''}" placeholder="0,00"></div>
      <div><label>Vencimento</label><input id="l-venc" type="date" value="${l.vencimento}" onchange="if(!$('l-comp').dataset.mexeu)$('l-comp').value=this.value.slice(0,7)"></div>
      <div><label>Competência (DRE)</label><input id="l-comp" type="month" value="${l.competencia}" oninput="this.dataset.mexeu=1"></div></div>
    <div class="f2"><div><label>Categoria</label><select id="l-cat">${opts(cats.map(c => [c.id, c.nome]), l.categoria_id, 'Escolha…')}</select></div>
      <div><label>Forma de ${pagar ? 'pagamento' : 'recebimento'}</label><select id="l-forma">${opts(FORMAS, l.forma, '—')}</select></div></div>
    ${id ? '' : `<div class="f2"><div><label>Repetir</label><select id="l-rep">${opts([['1', 'Não repetir'], ['m', 'Todo mês (conta fixa)'], ['p', 'Parcelado']], '1')}</select></div>
      <div><label>Quantas vezes</label><input id="l-vezes" type="number" min="1" max="120" value="12"><div class="help">Conta fixa: cria os próximos meses com o mesmo valor. Parcelado: marca 1/N, 2/N…</div></div></div>`}
    <div><label>Observações</label><input id="l-obs" value="${esc(l.observacoes || '')}"></div>
    ${id && l.status === 'pago' ? `<div class="help">${pagar ? 'Paga' : 'Recebida'} em ${F.fmtData(l.data_pagamento)} · ${brl(l.valor_pago ?? l.valor)}. Para mudar a baixa, use "Estornar".</div>` : ''}
    ${doGrupo ? `<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="l-prox"> Aplicar valor, categoria e descrição também aos próximos ${doGrupo} em aberto desta repetição</label>` : ''}`,
    `${id ? `<button class="btn danger" style="margin-right:auto" onclick="excluirLancamento('${id}')">Excluir</button>
       ${l.status !== 'cancelado' ? `<button class="btn sec" onclick="cancelarLancamento('${id}')">Cancelar ${pagar ? 'conta' : 'receita'}</button>` : ''}` : ''}
     <button class="btn sec" onclick="fechar()">Fechar</button><button class="btn" id="l-ok" onclick="salvarLancamento('${tipo}','${id || ''}')">Salvar</button>`);
}
async function salvarLancamento(tipo, id) {
  const base = {
    tipo, descricao: $('l-desc').value.trim(), fornecedor: $('l-forn').value.trim() || null,
    valor: num($('l-valor').value), vencimento: $('l-venc').value, competencia: $('l-comp').value || $('l-venc').value.slice(0, 7),
    categoria_id: $('l-cat').value || null, forma: $('l-forma').value || null, observacoes: $('l-obs').value.trim() || null,
  };
  if (!base.descricao) return toast('Informe a descrição.', true);
  if (!(base.valor > 0)) return toast('Informe o valor.', true);
  if (!base.vencimento) return toast('Informe o vencimento.', true);
  if (!base.categoria_id) return toast('Escolha a categoria (ela define a linha da DRE).', true);
  $('l-ok').disabled = true;
  try {
    if (id) {
      const { data, error } = await sb.from('fin_lancamentos').update(base).eq('id', id).select().single();
      chk(error);
      S.lancamentos = S.lancamentos.map(x => x.id === id ? data : x);
      if ($('l-prox') && $('l-prox').checked) {
        const ref = data, prox = S.lancamentos.filter(x => x.grupo === ref.grupo && x.status === 'aberto' && x.vencimento > ref.vencimento);
        const muda = { descricao: base.descricao, fornecedor: base.fornecedor, valor: base.valor, categoria_id: base.categoria_id, forma: base.forma };
        chk((await sb.from('fin_lancamentos').update(muda).in('id', prox.map(x => x.id))).error);
        prox.forEach(x => Object.assign(x, muda));
      }
      toast('Salvo.');
    } else {
      const rep = $('l-rep').value, vezes = rep === '1' ? 1 : +$('l-vezes').value || 1;
      const grupo = vezes > 1 ? crypto.randomUUID() : null;
      const rows = F.repetir(base, vezes, rep === 'p').map(r => ({ ...r, grupo }));
      const { data, error } = await sb.from('fin_lancamentos').insert(rows).select();
      chk(error);
      S.lancamentos = S.lancamentos.concat(data).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
      toast(rows.length > 1 ? `${rows.length} lançamentos criados.` : 'Salvo.');
    }
    fechar(); render();
  } finally { const b = $('l-ok'); if (b) b.disabled = false; }
}
async function excluirLancamento(id) {
  const l = S.lancamentos.find(x => x.id === id);
  const prox = l.grupo ? S.lancamentos.filter(x => x.grupo === l.grupo && x.status === 'aberto' && x.vencimento > l.vencimento) : [];
  let ids = [id];
  if (prox.length && confirm(`Excluir também os próximos ${prox.length} lançamento(s) em aberto desta repetição?\n\nOK = este e os próximos · Cancelar = só este`)) ids = ids.concat(prox.map(x => x.id));
  else if (!prox.length && !confirm('Excluir este lançamento?')) return;
  chk((await sb.from('fin_lancamentos').delete().in('id', ids)).error);
  S.lancamentos = S.lancamentos.filter(x => !ids.includes(x.id)); ids.forEach(i => S.sel.delete(i));
  toast(`${ids.length} excluído(s).`); fechar(); render();
}
async function cancelarLancamento(id) {
  if (!confirm('Cancelar? O lançamento fica no histórico, mas sai do fluxo e da DRE.')) return;
  chk((await sb.from('fin_lancamentos').update({ status: 'cancelado' }).eq('id', id)).error);
  S.lancamentos.find(x => x.id === id).status = 'cancelado';
  fechar(); render();
}

function mBaixa(ids) {
  const ls = ids.map(itemPorId).filter(Boolean);
  const pagar = ls[0].tipo === 'pagar', um = ls.length === 1, hon = um && ehHon(ls[0].id);
  modal(`${pagar ? 'Pagar' : 'Receber'} ${um ? esc(ls[0].descricao) : ls.length + ' lançamentos'}`, `
    <div class="f2"><div><label>Data do ${pagar ? 'pagamento' : 'recebimento'}</label><input id="b-data" type="date" value="${hojeISO()}"></div>
      <div><label>Conta bancária</label><select id="b-conta">${opts(S.contas.filter(c => c.ativo).map(c => [c.id, c.nome]), S.contas.length === 1 ? S.contas[0].id : '', '—')}</select></div></div>
    ${ls.some(l => ehHon(l.id)) ? '<div class="help">Honorário: fica como <b>Pago</b> no Gestão Fiscal, com esta data de recebimento.</div>' : ''}
    ${um ? `<div class="f2"><div><label>Valor ${pagar ? 'pago' : 'recebido'}${hon ? '' : ' (com juros/desconto)'}</label><input id="b-valor" inputmode="decimal" value="${String(ls[0].valor).replace('.', ',')}" ${hon ? 'disabled title="Para mudar o valor do honorário, edite no Gestão Fiscal"' : ''}></div>
      <div><label>Forma</label><select id="b-forma">${opts(FORMAS, ls[0].forma, '—')}</select></div></div>`
      : `<div class="help">Total: <b>${brl(ls.reduce((a, l) => a + +l.valor, 0))}</b>. Cada um é baixado pelo próprio valor.</div>`}`,
    `<button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn ok" id="b-ok" onclick="salvarBaixa(${JSON.stringify(ids).replace(/"/g, '&quot;')})">Confirmar</button>`);
}
async function salvarBaixa(ids) {
  const data_pagamento = $('b-data').value, conta_id = $('b-conta').value || null;
  if (!data_pagamento) return toast('Informe a data.', true);
  $('b-ok').disabled = true;
  try {
    for (const id of ids.filter(ehHon)) {
      const h = S.honorarios.find(x => x.id === id.slice(2));
      const muda = { status: 'Pago', data_pagamento, ...(ids.length === 1 && $('b-forma').value ? { forma: $('b-forma').value } : {}) };
      chk((await sb.from('gclik_honorarios').update(muda).eq('id', h.id)).error);
      Object.assign(h, muda);
    }
    const lanc = ids.filter(id => !ehHon(id));
    if (lanc.length === 1 && ids.length === 1) { // uma conta: usa valor e forma do formulário
      const muda = { status: 'pago', data_pagamento, conta_id, valor_pago: num($('b-valor').value), forma: $('b-forma').value || null };
      chk((await sb.from('fin_lancamentos').update(muda).eq('id', ids[0])).error);
      Object.assign(S.lancamentos.find(x => x.id === ids[0]), muda);
    } else {
      for (const id of lanc) {
        const l = S.lancamentos.find(x => x.id === id);
        const muda = { status: 'pago', data_pagamento, conta_id, valor_pago: +l.valor };
        chk((await sb.from('fin_lancamentos').update(muda).eq('id', id)).error);
        Object.assign(l, muda);
      }
    }
    ids.forEach(i => S.sel.delete(i));
    toast(`${ids.length} baixado(s).`); fechar(); render();
  } finally { const b = $('b-ok'); if (b) b.disabled = false; }
}
async function estornar(id) {
  if (!confirm('Estornar a baixa? O lançamento volta a ficar em aberto.')) return;
  if (ehHon(id)) {
    const h = S.honorarios.find(x => x.id === id.slice(2)), muda = { status: 'Pendente', data_pagamento: null };
    chk((await sb.from('gclik_honorarios').update(muda).eq('id', h.id)).error);
    Object.assign(h, muda);
    return render();
  }
  const muda = { status: 'aberto', data_pagamento: null, valor_pago: null, conta_id: null };
  chk((await sb.from('fin_lancamentos').update(muda).eq('id', id)).error);
  Object.assign(S.lancamentos.find(x => x.id === id), muda);
  render();
}

// ════════════ FLUXO DE CAIXA ════════════
function saldoBase() {
  const ativas = S.contas.filter(c => c.ativo);
  return {
    saldoInicial: ativas.reduce((a, c) => a + +c.saldo_inicial, 0),
    dataSaldo: ativas.length ? ativas.map(c => c.data_saldo).sort()[0] : '0000-00-00',
  };
}
function vFluxo() {
  const hoje = hojeISO(), base = saldoBase();
  const meses = F.fluxoMensal({ movimentos: movimentos(), ano: S.ano, ...base, hoje });
  const tot = k => meses.reduce((a, m) => a + m[k], 0);
  const cel = (v, forte) => `<td class="num nowrap" style="${v < 0 ? 'color:var(--danger);' : ''}${forte ? 'font-weight:700' : ''}">${v ? brl(v) : '<span class="muted">—</span>'}</td>`;
  const linha = (rotulo, k, forte, cor) => `<tr><td class="nowrap" style="${cor ? `color:${cor};` : ''}${forte ? 'font-weight:700' : ''}">${rotulo}</td>${meses.map(m => k.startsWith('saldo') && m.antesDoSaldo ? '<td class="num muted">—</td>' : cel(m[k], forte)).join('')}${k.startsWith('saldo') ? '<td></td>' : cel(tot(k), true)}</tr>`;
  const grupos = Object.keys(F.GRUPOS).filter(g => meses.some(m => m.saidasPorGrupo[g]));
  const mesHoje = hoje.slice(0, 7);
  const prox = movimentos().filter(m => m.status === 'aberto').sort((a, b) => a.vencimento.localeCompare(b.vencimento)).filter(m => m.vencimento <= F.mesmoDia(hoje, 1));
  $('view').innerHTML = `
    <div class="head"><div><h1>Fluxo de caixa</h1><p>Realizado (o que foi pago e recebido) e previsto (o que está em aberto). Honorários entram na data do recebimento (ou no vencimento, se foram marcados como pagos no Gestão Fiscal).</p></div>
      <div class="acts"><select onchange="S.ano=+this.value;render()" style="width:auto">${opts([S.ano - 1, S.ano, S.ano + 1].map(String), String(S.ano))}</select></div></div>
    ${S.contas.length ? '' : `<div class="card" style="margin-bottom:14px;border-color:var(--warn)">Cadastre as contas bancárias com o saldo de hoje em <a href="#" onclick="ir('config');return false">Categorias e contas</a> para o saldo ficar certo. Sem isso o fluxo começa do zero.</div>`}
    <div class="tbl"><table><thead><tr><th></th>${MESES.map((n, i) => `<th class="num" style="${`${S.ano}-${String(i + 1).padStart(2, '0')}` === mesHoje ? 'color:var(--accent)' : ''}">${n}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      ${linha('Saldo inicial', 'saldoInicial', true)}
      ${linha('(+) Entradas', 'entradas', false, 'var(--ok)')}
      ${linha('(−) Saídas', 'saidas', false, 'var(--danger)')}
      ${grupos.map(g => `<tr><td class="muted nowrap" style="padding-left:22px">${esc(F.GRUPOS[g].nome)}</td>${meses.map(m => cel(m.saidasPorGrupo[g] || 0)).join('')}${cel(meses.reduce((a, m) => a + (m.saidasPorGrupo[g] || 0), 0))}</tr>`).join('')}
      ${linha('Saldo final (realizado)', 'saldoFinal', true)}
      <tr><td colspan="14" style="padding:4px"></td></tr>
      ${linha('Previsto a receber', 'prevEntradas', false, 'var(--ok)')}
      ${linha('Previsto a pagar', 'prevSaidas', false, 'var(--danger)')}
      ${linha('Saldo projetado', 'saldoProjetado', true, 'var(--accent)')}
    </tbody></table></div>
    <div class="help" style="margin-top:8px">O que venceu e não foi pago entra como previsto no mês atual. Saldo inicial: soma das contas bancárias${S.contas.length ? ` (a partir de ${F.fmtData(base.dataSaldo)})` : ''}.</div>
    <div class="card" style="margin-top:16px"><h2>Próximos 30 dias e atrasados</h2>
      ${prox.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th class="num">Entrada</th><th class="num">Saída</th></tr></thead><tbody>
      ${prox.map(m => `<tr><td class="nowrap" style="${m.vencimento < hoje ? 'color:var(--danger)' : ''}">${F.fmtData(m.vencimento)}</td><td>${esc(m.descricao)}<div class="muted">${esc(m.categoria)}</div></td>
        <td class="num nowrap" style="color:var(--ok)">${m.tipo === 'receber' ? brl(m.valor) : ''}</td><td class="num nowrap" style="color:var(--danger)">${m.tipo === 'pagar' ? brl(m.valor) : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Nada em aberto.</div>'}</div>`;
}

// ════════════ DRE ════════════
function vDre() {
  const d = F.dre({ movimentos: movimentos(), ano: S.ano, regime: S.regime });
  const cel = (v, forte, pct) => `<td class="num nowrap" style="${v < 0 ? 'color:var(--danger);' : ''}${forte ? 'font-weight:700' : ''}">${v == null ? '<span class="muted">—</span>' : pct ? (v * 100).toFixed(1).replace('.', ',') + '%' : v ? brl(v) : '<span class="muted">—</span>'}</td>`;
  const grupo = (g, sinal) => {
    const vals = d.grupos[g].map(v => sinal * v), cats = Object.entries(d.categorias[g]);
    const aberto = S.abertos.has(g);
    return `<tr style="cursor:${cats.length ? 'pointer' : 'default'}" onclick="${cats.length ? `S.abertos.has('${g}')?S.abertos.delete('${g}'):S.abertos.add('${g}');render()` : ''}">
      <td class="nowrap">${cats.length ? (aberto ? '▾ ' : '▸ ') : '&nbsp;&nbsp; '}${sinal < 0 ? '(−) ' : '(+) '}${esc(F.GRUPOS[g].nome)}</td>${vals.map(v => cel(v)).join('')}${cel(F.total(vals), true)}</tr>` +
      (aberto ? cats.map(([c, vs]) => `<tr><td class="muted nowrap" style="padding-left:34px">${esc(c)}</td>${vs.map(v => cel(sinal * v)).join('')}${cel(sinal * F.total(vs))}</tr>`).join('') : '');
  };
  const res = (rotulo, vals, cor) => `<tr style="background:var(--surface2)"><td class="nowrap" style="font-weight:800;${cor ? `color:${cor}` : ''}">= ${rotulo}</td>${vals.map(v => cel(v, true)).join('')}${cel(F.total(vals), true)}</tr>`;
  const totRec = F.total(d.linhas.receitaBruta), totLuc = F.total(d.linhas.lucroLiquido);
  $('view').innerHTML = `
    <div class="head"><div><h1>DRE gerencial</h1><p>${S.regime === 'competencia' ? 'Por competência: cada receita e despesa no mês a que se refere, paga ou não.' : 'Por caixa: só o que foi pago e recebido, no mês do pagamento.'}</p></div>
      <div class="acts"><div class="tabs" style="margin:0">${[['competencia', 'Competência'], ['caixa', 'Caixa']].map(([v, n]) => `<button class="tab ${S.regime === v ? 'on' : ''}" onclick="S.regime='${v}';render()">${n}</button>`).join('')}</div>
      <select onchange="S.ano=+this.value;render()" style="width:auto">${opts([S.ano - 1, S.ano, S.ano + 1].map(String), String(S.ano))}</select></div></div>
    <div class="kpis">
      <div class="kpi" style="--c:var(--ok)"><div class="v" style="font-size:20px">${brl(totRec)}</div><div class="l">Receita em ${S.ano}</div></div>
      <div class="kpi" style="--c:${totLuc < 0 ? 'var(--danger)' : 'var(--accent)'}"><div class="v" style="font-size:20px">${brl(totLuc)}</div><div class="l">Lucro líquido</div></div>
      <div class="kpi" style="--c:var(--accent2)"><div class="v" style="font-size:20px">${totRec ? (totLuc / totRec * 100).toFixed(1).replace('.', ',') + '%' : '—'}</div><div class="l">Margem líquida</div></div>
    </div>
    <div class="tbl"><table><thead><tr><th></th>${MESES.map(n => `<th class="num">${n}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      ${grupo('receita', 1)}
      ${grupo('deducao', -1)}
      ${res('Receita líquida', d.linhas.receitaLiquida)}
      ${grupo('custo', -1)}
      ${res('Lucro bruto', d.linhas.lucroBruto)}
      ${grupo('pessoal', -1)}${grupo('administrativa', -1)}${grupo('comercial', -1)}
      ${res('Resultado operacional', d.linhas.resultadoOperacional)}
      ${grupo('financeira_receita', 1)}${grupo('financeira_despesa', -1)}
      ${res('Resultado antes do IR', d.linhas.resultadoAntesIR)}
      ${grupo('ir', -1)}
      ${res('Lucro líquido', d.linhas.lucroLiquido, 'var(--accent)')}
      <tr><td class="muted">Margem líquida</td>${d.linhas.margem.map(v => cel(v, false, true)).join('')}${cel(totRec ? totLuc / totRec : null, true, true)}</tr>
    </tbody></table></div>
    <div class="help" style="margin-top:8px">Clique numa linha para ver as categorias. Receita = honorários da JCR (Gestão Fiscal) + receitas avulsas. Investimentos e distribuição de lucros ficam fora da DRE (aparecem só no fluxo de caixa). Cancelados não entram.</div>
    <div style="margin-top:12px"><button class="btn sec sm" onclick="window.print()">🖨️ Imprimir / salvar PDF</button></div>`;
}

// ════════════ CATEGORIAS E CONTAS ════════════
function vConfig() {
  const uso = id => S.lancamentos.filter(l => l.categoria_id === id).length;
  const linhaCat = c => `<tr style="${c.ativo ? '' : 'opacity:.5'}"><td style="cursor:pointer" onclick="mCategoria('${c.id}')"><b>${esc(c.nome)}</b></td>
    <td>${esc(F.GRUPOS[c.grupo_dre] ? F.GRUPOS[c.grupo_dre].nome : c.grupo_dre)}</td><td class="num">${uso(c.id)}</td>
    <td><button class="btn sec sm" onclick="mCategoria('${c.id}')">Editar</button></td></tr>`;
  $('view').innerHTML = `
    <div class="head"><div><h1>Categorias e contas</h1><p>A categoria define em que linha da DRE cada lançamento cai.</p></div>
      <div class="acts"><button class="btn sec" onclick="mConta()">+ Conta bancária</button><button class="btn" onclick="mCategoria()">+ Categoria</button></div></div>
    <div class="card" style="margin-bottom:16px"><h2>Contas bancárias</h2>
      ${S.contas.length ? `<table><thead><tr><th>Conta</th><th class="num">Saldo inicial</th><th>Em</th><th></th></tr></thead><tbody>
      ${S.contas.map(c => `<tr style="${c.ativo ? '' : 'opacity:.5'}"><td><b>${esc(c.nome)}</b></td><td class="num">${brl(c.saldo_inicial)}</td><td>${F.fmtData(c.data_saldo)}</td><td><button class="btn sec sm" onclick="mConta('${c.id}')">Editar</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="muted">Nenhuma. Cadastre cada conta com o saldo de um dia (ex.: hoje): o fluxo de caixa parte dele.</div>'}</div>
    <div class="grid g2">
      <div class="tbl"><table><thead><tr><th>Despesas</th><th>Linha da DRE</th><th class="num">Uso</th><th></th></tr></thead><tbody>${S.categorias.filter(c => c.tipo === 'despesa').map(linhaCat).join('')}</tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Receitas</th><th>Linha da DRE</th><th class="num">Uso</th><th></th></tr></thead><tbody>
        <tr><td><b>Honorários</b> <span class="chip">Gestão Fiscal</span></td><td>Receita de serviços</td><td class="num">${S.honorarios.length}</td><td></td></tr>
        ${S.categorias.filter(c => c.tipo === 'receita').map(linhaCat).join('')}</tbody></table></div>
    </div>`;
}
function mCategoria(id) {
  const c = S.categorias.find(x => x.id === id) || { nome: '', tipo: 'despesa', grupo_dre: 'administrativa', ativo: true, ordem: 99 };
  modal(id ? 'Editar categoria' : 'Nova categoria', `
    <div class="f2"><div><label>Nome</label><input id="c-nome" value="${esc(c.nome)}"></div>
      <div><label>Tipo</label><select id="c-tipo">${opts([['despesa', 'Despesa'], ['receita', 'Receita']], c.tipo)}</select></div></div>
    <div><label>Linha da DRE</label><select id="c-grupo">${opts(Object.entries(F.GRUPOS).map(([k, g]) => [k, g.nome]), c.grupo_dre)}</select></div>
    <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="c-ativo" ${c.ativo ? 'checked' : ''}> Ativa (aparece na hora de lançar)</label>
    ${id ? '<div class="help">Mudar a linha da DRE vale também para os lançamentos já feitos nesta categoria.</div>' : ''}`,
    `${id ? `<button class="btn danger" style="margin-right:auto" onclick="excluirCategoria('${id}')">Excluir</button>` : ''}<button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvarCategoria('${id || ''}')">Salvar</button>`);
}
async function salvarCategoria(id) {
  const row = { nome: $('c-nome').value.trim(), tipo: $('c-tipo').value, grupo_dre: $('c-grupo').value, ativo: $('c-ativo').checked };
  if (!row.nome) return toast('Informe o nome.', true);
  if (S.categorias.some(x => x.nome.toLowerCase() === row.nome.toLowerCase() && x.id !== id)) return toast('Já existe uma categoria com esse nome.', true);
  const q = id ? sb.from('fin_categorias').update(row).eq('id', id) : sb.from('fin_categorias').insert({ ...row, ordem: 99 });
  const { data, error } = await q.select().single();
  chk(error);
  S.categorias = S.categorias.filter(x => x.id !== data.id).concat(data).sort((a, b) => (a.ordem - b.ordem) || a.nome.localeCompare(b.nome));
  S.catPorId = new Map(S.categorias.map(x => [x.id, x]));
  toast('Categoria salva.'); fechar(); render();
}
async function excluirCategoria(id) {
  const n = S.lancamentos.filter(l => l.categoria_id === id).length;
  if (n) return toast(`Esta categoria tem ${n} lançamento(s). Desmarque "Ativa" em vez de excluir.`, true);
  if (!confirm('Excluir a categoria?')) return;
  chk((await sb.from('fin_categorias').delete().eq('id', id)).error);
  S.categorias = S.categorias.filter(x => x.id !== id); S.catPorId.delete(id);
  fechar(); render();
}
function mConta(id) {
  const c = S.contas.find(x => x.id === id) || { nome: '', saldo_inicial: 0, data_saldo: hojeISO(), ativo: true };
  modal(id ? 'Editar conta bancária' : 'Nova conta bancária', `
    <div><label>Nome</label><input id="k-nome" value="${esc(c.nome)}" placeholder="Ex.: Unicred PJ"></div>
    <div class="f2"><div><label>Saldo (R$)</label><input id="k-saldo" inputmode="decimal" value="${String(c.saldo_inicial).replace('.', ',')}"></div>
      <div><label>Saldo do dia</label><input id="k-data" type="date" value="${c.data_saldo}"></div></div>
    <div class="help">O fluxo de caixa parte deste saldo e soma o que foi pago e recebido a partir desta data. Use o saldo do extrato no fim do dia anterior ao primeiro lançamento.</div>
    <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="k-ativo" ${c.ativo ? 'checked' : ''}> Ativa</label>`,
    `${id ? `<button class="btn danger" style="margin-right:auto" onclick="excluirConta('${id}')">Excluir</button>` : ''}<button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvarConta('${id || ''}')">Salvar</button>`);
}
async function salvarConta(id) {
  const row = { nome: $('k-nome').value.trim(), saldo_inicial: num($('k-saldo').value), data_saldo: $('k-data').value, ativo: $('k-ativo').checked };
  if (!row.nome || !row.data_saldo) return toast('Informe o nome e a data do saldo.', true);
  const q = id ? sb.from('fin_contas_bancarias').update(row).eq('id', id) : sb.from('fin_contas_bancarias').insert(row);
  const { data, error } = await q.select().single();
  chk(error);
  S.contas = S.contas.filter(x => x.id !== data.id).concat(data).sort((a, b) => a.nome.localeCompare(b.nome));
  toast('Conta salva.'); fechar(); render();
}
async function excluirConta(id) {
  if (!confirm('Excluir a conta bancária? Os lançamentos continuam, só perdem a ligação com ela.')) return;
  chk((await sb.from('fin_contas_bancarias').delete().eq('id', id)).error);
  S.contas = S.contas.filter(x => x.id !== id);
  fechar(); render();
}

// ── início ──
(async function () {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '../index.html?next=' + encodeURIComponent(location.href); return; }
  try { const p = sessionStorage.getItem('fin-pagina'); if (p && PAGINAS.some(x => x.id === p)) S.pagina = p; } catch (e) {}
  try { await carregar(); }
  catch (e) { $('view').innerHTML = `<div class="empty">Não foi possível carregar o financeiro: ${esc(e.message || e)}</div>`; return; }
  render();
})();
</script>
</body>
</html>
