<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="assets/jcr-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Procedimento · Portal JCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="assets/departamentos.js"></script>
<script src="assets/procedimentos.js"></script>
<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:#2a2f42; --border2:#363d55;
  --text:#e8eaf2; --text2:#9aa1b8; --text3:#626a85;
  --accent:#4f8ef7; --accent2:#a78bfa; --ok:#34d399; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:inherit}
main{max-width:860px;margin:0 auto;padding:26px 20px 90px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--text3);margin-bottom:18px}
.crumbs a{color:var(--text2);text-decoration:none}
.crumbs a:hover{color:var(--text)}
.head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;
  background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
h1{font:800 24px/1.2 Syne,sans-serif}
.sub{color:var(--text2);font-size:13px;margin-top:3px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-pend{background:rgba(251,191,36,.12);color:var(--warn)}
.b-ok{background:rgba(52,211,153,.13);color:var(--ok)}
.aviso{margin:20px 0;padding:14px 16px;border-radius:14px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);
  font-size:13px;color:var(--text2);line-height:1.55}
.aviso b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:20px 0}
.kv{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.kv span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.kv div{font-size:13.5px}
section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}
section h2{font:700 12px Syne,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
ol,ul{padding-left:20px;font-size:14px;line-height:1.7}
.check{list-style:none;padding:0}
.check li{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;accent-color:var(--accent)}
.vazio{color:var(--text3);font-style:italic;font-size:13.5px}
.tools a{display:inline-flex;margin:0 8px 8px 0;padding:6px 12px;border-radius:999px;border:1px solid var(--border2);
  text-decoration:none;font-size:13px;background:var(--surface2)}
.tools a:hover{border-color:var(--accent)}
.erro{padding:60px 0;text-align:center;color:var(--text2)}
@media print{ body{background:#fff;color:#000} section,.kv{border-color:#ccc;background:#fff} .crumbs,.aviso{display:none} }
</style>
</head>
<body>
<main id="view"></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = new URLSearchParams(location.search);
const dep = (window.JCR_DEPARTAMENTOS || []).find(d => d.id === q.get('dep'));
const proc = dep && dep.processos.find(p => p.id === q.get('proc'));
const pop = dep && proc && (window.JCR_PROCEDIMENTOS || {})[dep.id + '/' + proc.id];
const view = document.getElementById('view');

const lista = (itens, tipo = 'ul', vazio) => itens && itens.length
  ? `<${tipo}>${itens.map(i => `<li>${esc(i)}</li>`).join('')}</${tipo}>`
  : `<p class="vazio">${vazio}</p>`;

if (!proc) {
  view.innerHTML = '<div class="erro">Processo não encontrado. <a href="index.html">Voltar ao portal</a></div>';
} else {
  document.title = proc.nome + ' · Portal JCR';
  const p = pop || {};
  view.innerHTML = `
    <div class="crumbs"><a href="index.html">Portal</a> › <a href="index.html#/${esc(dep.id)}">${dep.ic} ${esc(dep.nome)}</a> › <span>Procedimento</span></div>
    <div class="head" style="--c:${dep.cor}">
      <div class="ic">${dep.ic}</div>
      <div><h1>${esc(proc.nome)}<span class="badge ${pop ? 'b-ok' : 'b-pend'}">${pop ? 'Documentado' : 'A documentar'}</span></h1>
      <div class="sub">${esc(dep.nome)}${p.atualizado ? ' · atualizado em ' + esc(p.atualizado.split('-').reverse().join('/')) : ''}</div></div>
    </div>
    ${pop ? '' : `<div class="aviso"><b>Procedimento ainda não escrito.</b> Abaixo está o modelo padrão que todos os procedimentos vão seguir.
      Para preenchê-lo, descreva como o processo é feito hoje (pode ser em texto livre ou áudio transcrito) e ele será organizado neste formato.</div>`}
    <div class="grid">
      <div class="kv"><span>Responsável</span><div>${esc(p.responsavel) || '<i class="vazio">a definir</i>'}</div></div>
      <div class="kv"><span>Frequência</span><div>${esc(proc.freq) || '—'}</div></div>
      <div class="kv"><span>Prazo</span><div>${esc(p.prazo) || '<i class="vazio">a definir</i>'}</div></div>
    </div>
    <section><h2>Objetivo</h2>${p.objetivo ? `<p>${esc(p.objetivo)}</p>` : '<p class="vazio">Para que serve este processo e qual o resultado esperado.</p>'}</section>
    <section><h2>Documentos e informações de entrada</h2>${lista(p.entradas, 'ul', 'O que é preciso receber do cliente ou de outro departamento antes de começar.')}</section>
    <section><h2>Passo a passo</h2>${lista(p.passos, 'ol', 'Cada etapa, na ordem, com sistema usado e quem faz.')}</section>
    <section><h2>Checklist de conferência</h2>${p.checklist && p.checklist.length
      ? `<ul class="check">${p.checklist.map(i => `<li><input type="checkbox"><span>${esc(i)}</span></li>`).join('')}</ul>`
      : '<p class="vazio">Itens a conferir antes de dar o processo como concluído.</p>'}</section>
    <section><h2>Ferramentas usadas</h2>${p.ferramentas && p.ferramentas.length
      ? `<div class="tools">${p.ferramentas.map(f => f.url ? `<a href="${esc(f.url)}">${esc(f.nome)}</a>` : `<a>${esc(f.nome)}</a>`).join('')}</div>`
      : '<p class="vazio">Sistemas, sites e ferramentas do portal usados neste processo.</p>'}</section>
    <section><h2>Pontos de atenção</h2>${lista(p.atencao, 'ul', 'Erros comuns, exceções e situações que exigem cuidado.')}</section>`;
}
</script>
</body>
</html>
