<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../assets/jcr-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:#2a2f42; --border2:#363d55;
  --text:#e8eaf2; --text2:#9aa1b8; --text3:#626a85;
  --accent:#60a5fa; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:1440px;margin:0 auto;padding:24px 24px 90px}
.crumbs{font-size:12.5px;color:var(--text3);margin-bottom:12px}
.crumbs a{color:var(--text2);text-decoration:none}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.head h1{font:800 22px Syne,sans-serif}
.head p{color:var(--text2);font-size:13px;margin-top:2px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6b7ff7);color:#fff;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.layout{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font:700 11.5px Syne,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .acao{margin-left:auto;text-transform:none;letter-spacing:0}
.campos{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}.c1{grid-column:span 1}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.help{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.4}
.check{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);margin:0;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.socio{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.socio .topo{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.socio .topo .x{margin-left:auto}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border2);text-decoration:none;color:var(--text);background:var(--surface2)}
.links a:hover{border-color:var(--accent)}
.links a.pres{border-style:dashed}
.previa{position:sticky;top:16px}
.pend{border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--text2);margin-bottom:10px;border:1px solid}
.pend b{display:block;margin-bottom:3px}
.pend ul{padding-left:18px;line-height:1.55}
.p-erro{background:color-mix(in srgb,var(--danger) 9%,var(--surface));border-color:color-mix(in srgb,var(--danger) 40%,transparent)} .p-erro b{color:var(--danger)}
.p-falta{background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .p-falta b{color:var(--warn)}
.p-ok{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .p-ok b{color:var(--ok)}
.folha{background:#fff;color:#111;border-radius:6px;padding:48px 56px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.55;max-height:calc(100vh - 170px);overflow:auto}
.folha p{text-align:justify;margin-bottom:9px}
.folha .titulo{text-align:center;font-weight:700;margin-bottom:2px}
.folha .centro{text-align:center;margin-bottom:14px}
.folha .secao{font-weight:700;margin:12px 0 3px}
.folha .item{margin:0 0 3px 18px}
.folha .quebra{margin-top:30px;padding-top:24px;border-top:1px dashed #bbb}
.folha table{border-collapse:collapse;width:100%;margin:4px 0 12px}
.folha td{border:1px solid #444;padding:4px 8px}
.folha tr:first-child td,.folha tr:last-child td{font-weight:700}
.folha .ass{text-align:center;margin-top:36px}
.folha .falta{color:#c00000;font-weight:700;background:#fff1f1;border-radius:3px;padding:0 2px}
.salvo{font-size:12px;color:var(--text3)}
.docs-lista{display:grid;gap:6px;margin-top:10px}
.doc{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-size:12.5px}
.doc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .t{color:var(--text3);font-size:11.5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:860px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font:700 16px Syne,sans-serif}
.modal-b{padding:14px 18px;max-height:62vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.sug{width:100%;border-collapse:collapse;font-size:13px}
.sug th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.sug td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.sug td.atual{color:var(--text3)}
.sug tr.conf td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.sug .av{font-size:11.5px;color:var(--warn);margin-top:3px}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;background:var(--surface3);border:1px solid var(--border2);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;max-width:380px}
.toast.err{border-left-color:var(--danger)}
@media (max-width:1000px){
  main{padding:16px 16px 90px}
  .layout{grid-template-columns:1fr}
  .campos{grid-template-columns:1fr 1fr}
  .c6,.c4,.c3{grid-column:span 2}.c2,.c1{grid-column:span 1}
  .previa{position:static}.folha{max-height:none;padding:24px 20px}
}
</style>
</head>
<body>
<main>
  <div class="crumbs"><a href="../index.html">Portal</a> › <a href="./">Painel Societário</a> › Dados e documentos</div>
  <div class="head">
    <div><h1>📄 Dados e documentos</h1><p id="sub">Preencha os dados uma vez: o documento sai pronto, com o texto das cláusulas revisado.</p></div>
    <div class="acts">
      <span class="salvo" id="salvo"></span>
      <a class="btn sec" href="conferidor.html">🔎 Conferir PDFs</a>
      <button class="btn sec" id="b-salvar" onclick="salvar()" hidden>Salvar no processo</button>
      <button class="btn" onclick="baixar()">Baixar Word</button>
    </div>
  </div>
  <div id="modal-root"></div>
  <div class="layout">
    <div id="form"></div>
    <div class="previa"><div id="pend"></div><div class="folha" id="folha"></div></div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://onecnoicxqjhgolqncjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_paOFHdYEcMr7MZdOFx16Lw_sXt0n0-9';
const M = window.ModelosSoc, L = window.LinksSoc;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = s => { s = String(s ?? '').trim().replace(/\s|R\$/g, ''); if (!s) return null; return +(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
const fmtNum = v => (v == null || v === '' ? '' : String(v).replace('.', ','));
function toast(msg, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), erro ? 6000 : 3000);
}
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const hoje = new Date();
const dataExtenso = d => `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
const TIPO_DO_PROCESSO = { abertura: 'constituicao', alteracao: 'alteracao', transformacao: 'transformacao', encerramento: 'extincao' };
const FORMAS = ['em estabelecimento fixo, na sede', 'em estabelecimento fixo e por meio de internet', 'por meio de internet, sem estabelecimento fixo', 'em local de terceiros'];

const socioVazio = () => ({ nome: '', sexo: 'M', nacionalidade: 'brasileiro', estado_civil: 'solteiro', regime_bens: '', profissao: '', nascimento: '',
  naturalidade: '', rg: '', cpf: '', endereco: '', quotas: null, administrador: false, situacao: 'permanece' });
const vazio = tipo => ({ tipo, numero_alteracao: tipo === 'transformacao' ? '1' : '', local: '', data: dataExtenso(hoje),
  empresa: { nome: '', nome_ei: '', cnpj: '', nire: '', logradouro: '', numero: '', complemento: '', bairro: '', municipio: '', uf: 'SP', cep: '', iptu: '', area: '',
    objeto: [], forma_atuacao: FORMAS[0], inicio: '', capital: null, valor_quota: 1, integralizacao: 'imediata', integralizacao_prazo: '',
    enquadramento: 'ME', foro: '', administracao: 'isoladamente', advogado: '' },
  socios: [{ ...socioVazio(), administrador: true }],
  alteracao: { muda: {}, nome_novo: '', endereco_novo: { uf: 'SP' }, objeto_novo: [], capital_novo: null, cessoes: [], consolidar: true },
  distrato: { data_encerramento: '', haveres: 'nao_ha', partilha_texto: '', ativo_passivo: '', livros_nome: '', livros_endereco: '' },
  clausulas_adicionais: [] });

const S = { d: vazio('constituicao'), processo: null, sb: null, timer: null, sujo: false, docs: [], up: { tipo: 'pessoal', socio: 0 }, uid: null };

// ── leitura e escrita por caminho ("socios.0.nome") ──
function pegar(o, caminho) { return caminho.split('.').reduce((x, k) => (x == null ? x : x[k]), o); }
function por(o, caminho, valor) {
  const ks = caminho.split('.'); let x = o;
  ks.slice(0, -1).forEach((k, i) => { if (x[k] == null) x[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; x = x[k]; });
  x[ks[ks.length - 1]] = valor;
}

// ── campos ──
function campo(caminho, rotulo, tam = 'c3', o = {}) {
  const val = caminho.startsWith('_up.') ? S.up[caminho.slice(4)] : pegar(S.d, caminho);
  const id = 'f-' + caminho.replace(/\./g, '-');
  const re = o.re ? 'data-re="1"' : '';
  let html;
  if (o.tipo === 'select') html = `<select id="${id}" data-k="${caminho}" ${re}>${o.opcoes.map(x => { const [v, n] = Array.isArray(x) ? x : [x, x || '—']; return `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(n)}</option>`; }).join('')}</select>`;
  else if (o.tipo === 'linhas') html = `<textarea id="${id}" data-k="${caminho}" data-linhas="1" style="min-height:110px">${esc((val || []).join('\n'))}</textarea>`;
  else if (o.tipo === 'textarea') html = `<textarea id="${id}" data-k="${caminho}">${esc(val)}</textarea>`;
  else if (o.tipo === 'check') return `<div class="${tam}"><label class="check"><input type="checkbox" id="${id}" data-k="${caminho}" data-check="1" ${re} ${val ? 'checked' : ''}> ${rotulo}</label></div>`;
  else html = `<input id="${id}" data-k="${caminho}" ${o.numero ? 'data-num="1" inputmode="decimal"' : ''} value="${esc(o.numero ? fmtNum(val) : val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}>`;
  return `<div class="${tam}"><label for="${id}">${rotulo}</label>${html}${o.help ? `<div class="help">${o.help}</div>` : ''}</div>`;
}
const linksHtml = lista => lista.length ? `<div class="links">${lista.map(l => `<a href="${esc(l.interno ? '../' + l.url : l.url)}" target="_blank" rel="noopener" class="${l.modo === 'presencial' ? 'pres' : ''}">${l.modo === 'presencial' ? '🏢 ' : '🌐 '}${esc(l.nome)}${l.conferir ? ' (confirmar)' : ''}</a>`).join('')}</div>` : '';

function enderecoCampos(base, titulo) {
  const mun = pegar(S.d, base + '.municipio');
  return `<div class="c6" style="font-weight:700;color:var(--text2);font-size:12px;margin-top:4px">${titulo}</div>
    ${campo(base + '.logradouro', 'Logradouro (como no IPTU)', 'c4', { ph: 'Rua …' })}${campo(base + '.numero', 'Número', 'c2')}
    ${campo(base + '.complemento', 'Complemento', 'c2')}${campo(base + '.bairro', 'Bairro', 'c4')}
    ${campo(base + '.municipio', 'Município', 'c3', { re: true })}${campo(base + '.uf', 'UF', 'c1')}${campo(base + '.cep', 'CEP', 'c2', { ph: '00000-000' })}
    <div class="c6">${linksHtml(L.resolver(['viabilidade_municipal', 'viabilidade_servico', 'vre', 'facilita'], mun))}</div>`;
}
const atividades = (k, rot) => campo(k, rot, 'c6', { tipo: 'linhas', help: 'Uma por linha: descrição + CNAE, iguais à viabilidade e ao DBE. Ex.: Consultoria em gestão empresarial (CNAE 7020-4/00).' });
const forma = k => campo(k, 'Forma de atuação', 'c6', { tipo: 'select', opcoes: FORMAS });
const enquadr = (k, tam) => campo(k, 'Enquadramento', tam, { tipo: 'select', re: true, opcoes: [['ME', 'Microempresa'], ['EPP', 'Empresa de pequeno porte'], ['', 'Demais (sem enquadramento)']] });
const modoAdm = (k, tam) => campo(k, 'Administradores agem', tam, { tipo: 'select', opcoes: [['isoladamente', 'isoladamente'], ['conjuntamente', 'em conjunto']] });

function socioCard(s, i, t) {
  const alt = t === 'alteracao', transf = t === 'transformacao', dist = t === 'extincao';
  const k = `socios.${i}`;
  return `<div class="socio"><div class="topo">${transf ? 'Titular' : `Sócio ${i + 1}`}${s.nome ? ' · ' + esc(s.nome) : ''}
      ${!transf && S.d.socios.length > 1 ? `<button class="btn sec sm x" onclick="removerSocio(${i})">Remover</button>` : ''}</div>
    <div class="campos">
      ${campo(k + '.nome', 'Nome civil completo', 'c4')}${campo(k + '.sexo', 'Gênero (texto)', 'c2', { tipo: 'select', opcoes: [['M', 'masculino'], ['F', 'feminino']] })}
      ${campo(k + '.nacionalidade', 'Nacionalidade', 'c2')}${campo(k + '.estado_civil', 'Estado civil', 'c2', { tipo: 'select', re: true, opcoes: ['solteiro', 'solteira', 'casado', 'casada', 'divorciado', 'divorciada', 'viúvo', 'viúva', 'solteiro, em união estável', 'solteira, em união estável'] })}
      ${/casad|uni/i.test(s.estado_civil || '') ? campo(k + '.regime_bens', 'Regime de bens', 'c2', { tipo: 'select', opcoes: ['', 'comunhão parcial de bens', 'comunhão universal de bens', 'separação total de bens', 'participação final nos aquestos'] }) : '<div class="c2"></div>'}
      ${campo(k + '.profissao', 'Profissão', 'c2', { ph: 'empresário' })}${campo(k + '.nascimento', 'Nascimento', 'c2', { ph: 'dd/mm/aaaa' })}${campo(k + '.naturalidade', 'Naturalidade (opcional)', 'c2', { ph: 'Cidade/UF' })}
      ${campo(k + '.rg', 'RG e órgão emissor', 'c3', { ph: '00.000.000 SSP/SP' })}${campo(k + '.cpf', 'CPF', 'c3')}
      ${campo(k + '.endereco', 'Endereço residencial completo com CEP', 'c6', { ph: 'Rua …, nº …, bairro, cidade/UF, CEP …' })}
      ${!dist && !transf ? campo(k + '.quotas', alt ? 'Quotas após a alteração' : 'Quotas', 'c2', { numero: true }) : ''}
      ${!dist && !transf ? campo(k + '.administrador', 'Administrador', 'c2', { tipo: 'check' }) : ''}
      ${alt ? campo(k + '.situacao', 'Nesta alteração', 'c2', { tipo: 'select', re: true, opcoes: [['permanece', 'permanece'], ['entra', 'entra (ingressante)'], ['sai', 'sai (retira-se)']] }) : ''}
    </div></div>`;
}

function renderForm() {
  const d = S.d, t = d.tipo, e = d.empresa, a = d.alteracao;
  const mun = e.municipio;
  const card = (titulo, corpo, acao = '') => `<div class="card"><h2>${titulo}${acao ? `<span class="acao">${acao}</span>` : ''}</h2>${corpo}</div>`;
  let h = card('Documento', `<div class="campos">
    ${campo('tipo', 'Ato', 'c6', { tipo: 'select', re: true, opcoes: Object.entries(M.MODELOS).map(([k, m]) => [k, m.nome]) })}
    ${S.processo ? `<div class="c6 help">Processo: <b>${esc(S.processo.empresa)}</b>. Os dados ficam salvos no processo.</div>` : '<div class="c6 help">Sem processo vinculado: os dados ficam só nesta tela. Abra pelo Painel Societário para salvar.</div>'}
  </div>`);

  h += card('Documentos do processo', S.processo ? `<div class="campos">
      ${campo('_up.tipo', 'Tipo de documento', 'c3', { tipo: 'select', re: true, opcoes: Object.entries(LeitorSoc.TIPOS_DOC) })}
      ${LeitorSoc.DO_SOCIO.has(S.up.tipo) ? `<div class="c3"><label for="f-up-socio">De qual sócio</label><select id="f-up-socio" onchange="S.up.socio=+this.value">${d.socios.map((s, i) => `<option value="${i}" ${i === S.up.socio ? 'selected' : ''}>${esc(s.nome || 'Sócio ' + (i + 1))}</option>`).join('')}<option value="${d.socios.length}" ${S.up.socio === d.socios.length ? 'selected' : ''}>+ novo sócio</option></select></div>` : '<div class="c3"></div>'}
      <div class="c6"><input type="file" id="f-up-arq" accept="application/pdf,image/jpeg,image/png,image/webp" onchange="enviarDocumento(this)">
        <div class="help">PDF, JPG ou PNG (até 15 MB). O arquivo fica guardado no processo e o portal lê os dados: você confere cada campo antes de aplicar. Ficha da JUCESP em PDF é lida aqui mesmo; fotos e outros documentos são lidos pela IA.</div></div>
    </div>
    <div class="docs-lista">${S.docs.map(x => `<div class="doc"><span>📎</span><span class="n" title="${esc(x.nome_arquivo)}">${esc(x.nome_arquivo)}<br><span class="t">${esc(LeitorSoc.TIPOS_DOC[x.tipo_doc] || x.tipo_doc)}${x.socio != null && LeitorSoc.DO_SOCIO.has(x.tipo_doc) ? ' · ' + esc((d.socios[x.socio] || {}).nome || 'sócio ' + (x.socio + 1)) : ''} · ${new Date(x.created_at).toLocaleDateString('pt-BR')}${x.lido_por ? ' · lido ' + (x.lido_por === 'ia' ? 'pela IA' : 'no navegador') : ''}</span></span>
      <button class="btn sec sm" onclick="verDocumento('${x.id}')">Ver</button><button class="btn sec sm" onclick="lerDocumento('${x.id}')">Ler e preencher</button><button class="btn sec sm" onclick="excluirDocumento('${x.id}')">✕</button></div>`).join('') || '<div class="help">Nenhum documento enviado ainda.</div>'}</div>`
    : '<div class="help">Abra este formulário pelo processo no Painel Societário para enviar documentos (RG/CNH, comprovante, IPTU, contrato anterior, ficha da JUCESP, cartão CNPJ). Eles ficam guardados no processo e preenchem os campos.</div>');

  if (t === 'constituicao') h += card('Empresa', `<div class="campos">
    ${campo('empresa.nome', 'Nome empresarial (com LTDA)', 'c6', { help: 'Igual ao aprovado na viabilidade/busca de nome.' })}
    ${enderecoCampos('empresa', 'Sede')}

// ── eventos do formulário ──
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.k || el.tagName === 'SELECT' || el.dataset.check || el.dataset.k.startsWith('_up.')) return;
  aplicar(el); atualizar(); marcarSujo();
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.k) return;
  if (el.dataset.k.startsWith('_up.')) { S.up[el.dataset.k.slice(4)] = el.value; renderForm(); return; }
  aplicar(el);
  if (el.dataset.k === 'tipo') trocarTipo(el.value);
  if (el.dataset.re) { const foco = el.id; renderForm(); const f = document.getElementById(foco); if (f && f.tagName === 'INPUT' && !el.dataset.check) f.focus(); }
  atualizar(); marcarSujo();
});
function aplicar(el) {
  const k = el.dataset.k;
  let val = el.dataset.check ? el.checked : el.value;
  if (el.dataset.num) val = num(val);
  if (el.dataset.linhas) val = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  por(S.d, k, val);
  if (k === 'empresa.municipio' && S.d.empresa.municipio) {
    const cid = `${S.d.empresa.municipio}/${S.d.empresa.uf || 'SP'}`;
    if (!S.d.empresa.foro) S.d.empresa.foro = cid;
    if (!S.d.local) S.d.local = cid;
  }
}
function trocarTipo(t) { if (t === 'transformacao') S.d.socios = [{ ...(S.d.socios[0] || socioVazio()), administrador: true }]; }
const mexeu = () => { renderForm(); atualizar(); marcarSujo(); };
function addSocio() { S.d.socios.push({ ...socioVazio(), situacao: S.d.tipo === 'alteracao' ? 'entra' : 'permanece' }); mexeu(); }
function removerSocio(i) { if (!confirm('Remover este sócio?')) return; S.d.socios.splice(i, 1); mexeu(); }
function addCessao() { (S.d.alteracao.cessoes = S.d.alteracao.cessoes || []).push({ cedente: '', cessionario: '', quotas: null, valor: null, gratuita: false }); mexeu(); }
function remCessao(i) { S.d.alteracao.cessoes.splice(i, 1); mexeu(); }
function addClausula() { (S.d.clausulas_adicionais = S.d.clausulas_adicionais || []).push({ titulo: '', texto: '' }); mexeu(); }
function remClausula(i) { S.d.clausulas_adicionais.splice(i, 1); mexeu(); }

// ── prévia e pendências ──
const partesHtml = partes => partes.map(p => (typeof p === 'string' ? esc(p) : `<span class="falta">[${esc(p.falta)}]</span>`)).join('');
function atualizar() {
  const b = M.gerar(S.d), falta = M.faltando(b), val = M.validar(S.d);
  const erros = val.filter(x => x.nivel === 'erro'), atencao = val.filter(x => x.nivel !== 'erro');
  $('pend').innerHTML =
    (erros.length ? `<div class="pend p-erro"><b>Corrigir (${erros.length})</b><ul>${erros.map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul></div>` : '') +
    (falta.length ? `<div class="pend p-falta"><b>Falta preencher (${falta.length})</b>${falta.map(esc).join(' · ')}. Sai em vermelho no Word.</div>` : '') +
    (atencao.length ? `<div class="pend p-falta"><b>Atenção</b><ul>${atencao.map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul></div>` : '') +
    (!erros.length && !falta.length ? '<div class="pend p-ok"><b>Tudo preenchido e conferido.</b> Leia o texto antes de baixar; depois de gerar os PDFs na JUCESP, passe no conferidor.</div>' : '');
  $('folha').innerHTML = b.map(x => {
    if (x.tipo === 'tabela') return `<table>${x.linhas.map(l => `<tr>${l.map(c => `<td>${partesHtml([c])}</td>`).join('')}</tr>`).join('')}</table>`;
    if (x.tipo === 'assinatura') return `<div class="ass">_____________________________________<br><b>${partesHtml(x.partes)}</b><br>${esc(x.cargo)}</div>`;
    const cls = { titulo: 'titulo', centro: 'centro', secao: 'secao', item: 'item' }[x.tipo] || '';
    return `<p class="${cls} ${x.quebra ? 'quebra' : ''}">${x.tipo === 'item' ? '• ' : ''}${partesHtml(x.partes)}</p>`;
  }).join('');
}

// ── salvar no processo ──
function marcarSujo() {
  if (!S.processo) return;
  S.sujo = true; $('salvo').textContent = 'alterações não salvas';
  clearTimeout(S.timer); S.timer = setTimeout(salvar, 2000);
}
async function salvar() {
  if (!S.processo || !S.sb) return;
  clearTimeout(S.timer);
  const r = await S.sb.from('soc_processos').update({ dados: S.d, municipio: S.d.empresa.municipio || null, updated_at: new Date().toISOString() }).eq('id', S.processo.id);
  if (r.error) { toast('Erro ao salvar: ' + r.error.message, true); return; }
  S.sujo = false; $('salvo').textContent = 'salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
window.addEventListener('beforeunload', ev => { if (S.sujo) { ev.preventDefault(); ev.returnValue = ''; } });

async function carregarProcesso(id) {
  if (!window.supabase) return;
  S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const r = await S.sb.from('soc_processos').select('*').eq('id', id).single();
  if (r.error || !r.data) { toast('Processo não encontrado.', true); return; }
  const p = S.processo = r.data;
  const tipo = TIPO_DO_PROCESSO[p.tipo] || 'constituicao';
  const temDados = p.dados && Object.keys(p.dados).length;
  if (temDados) { const base = vazio(p.dados.tipo || tipo); S.d = { ...base, ...p.dados, empresa: { ...base.empresa, ...p.dados.empresa }, alteracao: { ...base.alteracao, ...p.dados.alteracao }, distrato: { ...base.distrato, ...p.dados.distrato } }; }
  else {
    S.d = vazio(tipo);
    if (tipo === 'transformacao') { if (/ltda/i.test(p.empresa || '')) S.d.empresa.nome = p.empresa; }
    else S.d.empresa.nome = p.empresa || '';
    if (p.cliente_id) {
      const c = await S.sb.from('gclik_clientes').select('razao_social,cnpj,cidade,estado').eq('id', p.cliente_id).single();
      if (!c.error && c.data) {
        S.d.empresa.cnpj = c.data.cnpj || '';
        if (tipo === 'transformacao' && !/ltda/i.test(c.data.razao_social || '')) S.d.empresa.nome_ei = c.data.razao_social || '';
        if (c.data.cidade) { S.d.empresa.municipio = c.data.cidade; S.d.empresa.foro = `${c.data.cidade}/${c.data.estado || 'SP'}`; S.d.local = S.d.empresa.foro; }
      }
    }
  }
  const u = await S.sb.auth.getUser();
  S.uid = u.data && u.data.user ? u.data.user.id : null;
  await carregarDocs();
  $('b-salvar').hidden = false;
  $('sub').textContent = `${M.MODELOS[S.d.tipo].nome} · ${p.empresa}`;
  $('salvo').textContent = temDados ? 'dados carregados do processo' : 'novo preenchimento';
  renderForm(); atualizar();
}

// ── documentos: enviar, guardar, ler e sugerir ──
async function carregarDocs() {
  const r = await S.sb.from('soc_documentos').select('*').eq('processo_id', S.processo.id).order('created_at', { ascending: false });
  S.docs = r.error ? [] : r.data;
}
async function enviarDocumento(input) {
  const f = input.files[0]; input.value = '';
  if (!f || !S.processo) return;
  if (f.size > 15 * 1024 * 1024) return toast('Arquivo maior que 15 MB.', true);
  if (!S.uid) return toast('Faça login de novo para enviar documentos.', true);
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (!['pdf', 'jpg', 'jpeg', 'png', 'webp'].includes(ext)) return toast('Envie PDF, JPG, PNG ou WEBP.', true);
  const nomeLimpo = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_');
  const caminho = `${S.uid}/${S.processo.id}/${Date.now()}-${nomeLimpo}`;
  toast('Enviando…');
  const up = await S.sb.storage.from('societario').upload(caminho, f, { contentType: f.type || undefined });
  if (up.error) return toast('Erro ao enviar: ' + up.error.message, true);
  const socio = LeitorSoc.DO_SOCIO.has(S.up.tipo) ? S.up.socio : null;
  const r = await S.sb.from('soc_documentos').insert({ processo_id: S.processo.id, tipo_doc: S.up.tipo, socio, nome_arquivo: f.name, caminho, tamanho: f.size, mime: f.type }).select().single();
  if (r.error) return toast('Erro ao registrar: ' + r.error.message, true);
  S.docs.unshift(r.data); renderForm();
  lerDocumento(r.data.id, f);
}
async function textoDoPdf(blob) {
  if (!window.pdfjsLib) return null;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  const paginas = [];
  for (let i = 1; i <= doc.numPages; i++) paginas.push({ numero: i, texto: Conferidor.linhasDePagina((await (await doc.getPage(i)).getTextContent()).items) });
  return paginas;
}
async function lerDocumento(id, arquivo) {
  const doc = S.docs.find(x => x.id === id); if (!doc) return;
  toast('Lendo o documento…');
  let dados = null, por = null;
  try {
    // 1) formulários da JUCESP em PDF: leitura local, sem IA
    if (/pdf$/i.test(doc.caminho) && !LeitorSoc.DO_SOCIO.has(doc.tipo_doc) && doc.tipo_doc !== 'iptu') {
      const blob = arquivo || (await S.sb.storage.from('societario').download(doc.caminho)).data;
      const paginas = blob ? await textoDoPdf(blob) : null;
      const x = paginas && LeitorSoc.lerFormulariosJucesp(paginas, Conferidor.campo);
      if (x && (x.nome_empresarial || x.socios.length)) { dados = x; por = 'local'; }
    }
    // 2) demais: leitura pela IA (função no Supabase)
    if (!dados) {
      const r = await S.sb.functions.invoke('ler-documento-societario', { body: { caminho: doc.caminho, tipo_doc: doc.tipo_doc } });
      let corpo = r.data;
      if (r.error) { try { corpo = await r.error.context.json(); } catch { corpo = { erro: r.error.message }; } }
      if (!corpo || !corpo.ok) {
        const e = corpo && corpo.erro;
        return toast(e === 'sem_chave' ? 'A leitura por IA ainda não está configurada: falta a chave ANTHROPIC_API_KEY nos secrets do Supabase.' : 'Não consegui ler: ' + (e || 'erro desconhecido'), true);
      }
      dados = corpo.dados; por = 'ia';
    }
  } catch (e) { return toast('Erro na leitura: ' + e.message, true); }
  await S.sb.from('soc_documentos').update({ extraido: dados, lido_por: por }).eq('id', id);
  Object.assign(doc, { extraido: dados, lido_por: por });
  mostrarSugestoes(doc, dados);
}
function mostrarSugestoes(doc, dados) {
  const sug = LeitorSoc.propostas(doc.tipo_doc, dados, S.d, doc.socio || 0);
  S.sug = sug;
  const fmt = v => v == null ? '<i>vazio</i>' : Array.isArray(v) ? v.map(esc).join('<br>') : typeof v === 'boolean' ? (v ? 'sim' : 'não')
    : typeof v === 'number' ? v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : esc(v);
  $('modal-root').innerHTML = `<div class="ov" onclick="if(event.target===this)fecharModal()"><div class="modal">
    <div class="modal-h"><h3>Conferir dados lidos · ${esc(doc.nome_arquivo)}</h3></div>
    <div class="modal-b">${sug.length ? `<p class="help" style="margin-bottom:8px">Lido ${doc.lido_por === 'ia' ? 'pela IA' : 'no navegador'}. Marcados: campos vazios. Em amarelo: campo já preenchido com valor diferente — marque só se o documento estiver certo.</p>
      <table class="sug"><tr><th></th><th>Campo</th><th>Hoje</th><th>Lido no documento</th></tr>
      ${sug.map((x, i) => `<tr class="${x.conflito ? 'conf' : ''}"><td><input type="checkbox" id="sug-${i}" ${x.marcar ? 'checked' : ''}></td><td><label for="sug-${i}" style="margin:0;color:var(--text)">${esc(x.rotulo)}</label>${x.socio_novo ? '<div class="av">sócio novo no formulário</div>' : ''}</td>
        <td class="atual">${fmt(x.atual)}</td><td>${fmt(x.novo)}${x.aviso ? `<div class="av">⚠️ ${esc(x.aviso)}</div>` : ''}</td></tr>`).join('')}</table>`
      : '<p>Nada novo: os dados deste documento já estão no formulário (ou não foram encontrados nele).</p>'}</div>
    <div class="modal-f"><button class="btn sec" onclick="fecharModal()">Fechar</button>${sug.length ? '<button class="btn" onclick="aplicarSugestoes()">Aplicar marcados</button>' : ''}</div></div></div>`;
}
function fecharModal() { $('modal-root').innerHTML = ''; }
function aplicarSugestoes() {
  const escolhidas = (S.sug || []).filter((x, i) => $('sug-' + i) && $('sug-' + i).checked);
  LeitorSoc.aplicar(S.d, escolhidas, () => socioVazio());
  fecharModal(); renderForm(); atualizar(); marcarSujo();
  toast(`${escolhidas.length} campo(s) preenchido(s). Confira o texto ao lado.`);
}
async function verDocumento(id) {
  const doc = S.docs.find(x => x.id === id);
  const r = await S.sb.storage.from('societario').createSignedUrl(doc.caminho, 120);
  if (r.error) return toast('Erro: ' + r.error.message, true);
  window.open(r.data.signedUrl, '_blank', 'noopener');
}
async function excluirDocumento(id) {
  const doc = S.docs.find(x => x.id === id);
  if (!confirm(`Excluir "${doc.nome_arquivo}" do processo? O arquivo é apagado.`)) return;
  const a = await S.sb.storage.from('societario').remove([doc.caminho]);
  if (a.error) return toast('Erro ao apagar o arquivo: ' + a.error.message, true);
  await S.sb.from('soc_documentos').delete().eq('id', id);
  S.docs = S.docs.filter(x => x.id !== id); renderForm();
}

// ── Word ──
async function baixar() {
  if (!window.docx) return toast('Não foi possível carregar o gerador de Word. Verifique a internet e recarregue a página.', true);
  const D = window.docx, b = M.gerar(S.d);
  const runs = (partes, extra = {}) => partes.map(p => (typeof p === 'string'
    ? new D.TextRun({ text: p, ...extra })
    : new D.TextRun({ text: `[${p.falta}]`, bold: true, color: 'C00000' })));
  const just = D.AlignmentType.JUSTIFIED, centro = D.AlignmentType.CENTER;
  const filhos = [];
  b.forEach(x => {
    if (x.tipo === 'tabela') {
      filhos.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE },
        rows: x.linhas.map((l, i) => new D.TableRow({ children: l.map(c => new D.TableCell({
          children: [new D.Paragraph({ children: runs([c], { bold: i === 0 || i === x.linhas.length - 1 }) })],
          margins: { top: 40, bottom: 40, left: 100, right: 100 } })) })) }));
      filhos.push(new D.Paragraph({ text: '' }));
    } else if (x.tipo === 'assinatura') {
      filhos.push(new D.Paragraph({ alignment: centro, spacing: { before: 700 }, children: [new D.TextRun('_____________________________________________')] }));
      filhos.push(new D.Paragraph({ alignment: centro, children: runs(x.partes, { bold: true }) }));
      filhos.push(new D.Paragraph({ alignment: centro, children: [new D.TextRun(x.cargo)] }));
    } else {
      const titulo = x.tipo === 'titulo', centrado = titulo || x.tipo === 'centro';
      filhos.push(new D.Paragraph({
        alignment: centrado ? centro : just, pageBreakBefore: !!x.quebra,
        indent: x.tipo === 'item' ? { left: 360 } : undefined,
        spacing: { after: titulo ? 40 : x.tipo === 'item' ? 40 : x.tipo === 'centro' ? 280 : x.tipo === 'secao' ? 40 : 160, before: x.tipo === 'secao' ? 160 : 0 },
        children: runs((x.tipo === 'item' ? ['• '] : []).concat(x.partes), { bold: titulo || x.tipo === 'secao', size: titulo ? 24 : undefined }),
      }));
    }
  });
  const doc = new D.Document({ styles: { default: { document: { run: { font: 'Arial', size: 22 } } } },
    sections: [{ properties: { page: { margin: { top: 1134, bottom: 1134, left: 1418, right: 1418 } } }, children: filhos }] });
  const blob = await D.Packer.toBlob(doc);
  const nome = S.d.empresa.nome || S.d.empresa.nome_ei || 'documento';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${M.MODELOS[S.d.tipo].arquivo}_${nome.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '')}.docx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  const pend = M.faltando(b).length + M.validar(S.d).filter(x => x.nivel === 'erro').length;
  toast(pend ? `Word baixado com ${pend} pendência(s): corrija antes de assinar.` : 'Word baixado.');
  if (S.processo && S.sujo) salvar();
}

const params = new URLSearchParams(location.search);
renderForm(); atualizar();
if (params.get('processo')) carregarProcesso(params.get('processo')).catch(e => toast('Erro ao carregar: ' + e.message, true));
</script>
