<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../assets/jcr-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Certificados e alvarás · Portal JCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
<script src="societario-core.js"></script>
<style>
:root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;--surface3:#222739;--border:#2a2f42;--border2:#363d55;--text:#e8eaf2;--text2:#9aa1b8;--text3:#626a85;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:14px 'DM Sans',system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:1180px;margin:0 auto;padding:24px 24px 90px}
.crumbs{font-size:12.5px;color:var(--text3);margin-bottom:10px}.crumbs a{color:var(--text2);text-decoration:none}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.head h1{font:800 22px Syne,sans-serif}.head p{color:var(--text2);font-size:13px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6b7ff7);color:#fff;white-space:nowrap;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.sec{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}.btn.sm{padding:5px 10px;font-size:12.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{font:700 12px Syne,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.g{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;text-align:left;border-left:3px solid var(--c)}
.kpi.on{border-color:var(--c)}.kpi .v{font:800 22px Syne,sans-serif}.kpi .l{font-size:12px;color:var(--text2)}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
.tbl{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow-x:auto}
.badge{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.help{font-size:11.5px;color:var(--text3);margin-top:4px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface3);border:1px solid var(--border2);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;max-width:380px;z-index:9}.toast.err{border-left-color:var(--danger)}
@media (max-width:820px){.g{grid-template-columns:1fr 1fr}main{padding:16px}}
</style>
</head>
<body>
<main id="view">Carregando…</main>
<script>
const sb = supabase.createClient('https://onecnoicxqjhgolqncjj.supabase.co', 'sb_publishable_paOFHdYEcMr7MZdOFx16Lw_sXt0n0-9');
const SO = window.Societario;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dataBR = s => (s ? s.split('-').reverse().join('/') : '—');
function toast(m, e) { const t = document.createElement('div'); t.className = 'toast' + (e ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), e ? 6000 : 3000); }
const TIPOS = { certificado_a1: 'Certificado digital A1', certificado_a3: 'Certificado digital A3 (token/cartão)', alvara: 'Alvará / licença de funcionamento',
  licenca_sanitaria: 'Licença sanitária (VISA)', avcb: 'Bombeiros (AVCB/CLCB)', conselho: 'Registro em conselho (CRC, CRM, CREA…)', cetesb: 'Licença ambiental (CETESB)',
  procuracao: 'Procuração eletrônica (e-CAC etc.)', outro: 'Outro' };
const S = { itens: [], clientes: [], filtro: '60', ed: null };

async function carregar() {
  const [v, c] = await Promise.all([sb.from('soc_vencimentos').select('*').order('vencimento').limit(5000), sb.from('gclik_clientes').select('id,razao_social,cnpj,status').order('razao_social').limit(5000)]);
  if (v.error) throw new Error(v.error.message);
  S.itens = v.data; S.clientes = c.data || [];
}
const situacao = v => { const d = SO.diasEntre(hojeISO(), v.vencimento); return d < 0 ? ['vencido', 'var(--danger)', `vencido há ${-d} dia(s)`] : d <= 30 ? ['30', 'var(--orange)', `vence em ${d} dia(s)`] : d <= 60 ? ['60', 'var(--warn)', `vence em ${d} dias`] : ['ok', 'var(--ok)', `vence em ${d} dias`]; };

function render() {
  const cont = { vencido: 0, '30': 0, '60': 0, ok: 0 };
  S.itens.forEach(v => cont[situacao(v)[0]]++);
  const lista = S.itens.filter(v => { const s = situacao(v)[0]; return S.filtro === 'todos' || (S.filtro === '60' ? s !== 'ok' : s === S.filtro); });
  const kpi = (k, v, l, c) => `<button class="kpi ${S.filtro === k ? 'on' : ''}" style="--c:${c}" onclick="S.filtro='${k}';render()"><div class="v">${v}</div><div class="l">${l}</div></button>`;
  $('view').innerHTML = `
    <div class="crumbs"><a href="../index.html">Portal</a> › <a href="./">Painel Societário</a> › Certificados e alvarás</div>
    <div class="head"><div><h1>📅 Certificados, alvarás e licenças</h1><p>Vencimentos de todos os clientes. Os próximos 30 dias aparecem no Painel Societário e no e-mail diário do n8n.</p></div>
      <div class="acts"><label class="btn sec" style="margin:0">🔐 Ler certificado A1 (.pfx)<input type="file" accept=".pfx,.p12" style="display:none" onchange="lerCertificado(this)"></label><button class="btn" onclick="editar()">+ Novo vencimento</button></div></div>
    <div class="kpis">${kpi('vencido', cont.vencido, 'Vencidos', 'var(--danger)')}${kpi('30', cont['30'], 'Vencem em 30 dias', 'var(--orange)')}${kpi('60', cont.vencido + cont['30'] + cont['60'], 'Até 60 dias (inclui vencidos)', 'var(--warn)')}${kpi('todos', S.itens.length, 'Todos', 'var(--accent)')}</div>
    <div id="form"></div>
    <div class="tbl"><table><thead><tr><th>Vencimento</th><th>Empresa</th><th>O quê</th><th>Responsável</th><th></th></tr></thead><tbody>
      ${lista.map(v => { const s = situacao(v); return `<tr><td><b>${dataBR(v.vencimento)}</b><br><span class="badge" style="--c:${s[1]}">${s[2]}</span></td><td>${esc(v.empresa)}</td>
        <td>${esc(TIPOS[v.tipo] || v.tipo)}${v.descricao ? `<div class="help">${esc(v.descricao)}</div>` : ''}</td><td>${esc(v.responsavel || '')}</td>
        <td style="white-space:nowrap"><button class="btn sec sm" onclick="renovar('${v.id}')">Renovado</button> <button class="btn sec sm" onclick="editar('${v.id}')">Editar</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="help">Nada neste filtro.</td></tr>'}
    </tbody></table></div>`;
  if (S.ed) formulario();
}

function editar(id, pre) {
  S.ed = id ? { ...S.itens.find(v => v.id === id) } : { tipo: 'certificado_a1', empresa: '', vencimento: '', ...(pre || {}) };
  render(); $('form').scrollIntoView({ behavior: 'smooth' });
}
function formulario() {
  const v = S.ed;
  $('form').innerHTML = `<div class="card"><h3>${v.id ? 'Editar' : 'Novo'} vencimento</h3><div class="g">
    <div style="grid-column:span 2"><label>Empresa</label><input id="f-emp" list="dl-cli" value="${esc(v.empresa)}"><datalist id="dl-cli">${S.clientes.map(c => `<option value="${esc(c.razao_social)}">`).join('')}</datalist></div>
    <div><label>Tipo</label><select id="f-tipo">${Object.entries(TIPOS).map(([k, n]) => `<option value="${k}" ${v.tipo === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    <div><label>Vencimento</label><input type="date" id="f-venc" value="${esc(v.vencimento)}"></div>
    <div style="grid-column:span 2"><label>Descrição</label><input id="f-desc" value="${esc(v.descricao || '')}" placeholder="Ex.: e-CNPJ A1 (titular), Alvará nº 123/2026"></div>
    <div><label>Responsável</label><input id="f-resp" value="${esc(v.responsavel || '')}"></div>
    <div><label>Observação</label><input id="f-obs" value="${esc(v.obs || '')}"></div>
  </div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    ${v.id ? `<button class="btn sec" onclick="excluir('${v.id}')">Excluir</button>` : ''}<button class="btn sec" onclick="S.ed=null;render()">Cancelar</button><button class="btn" onclick="salvar()">Salvar</button></div></div>`;
}
async function salvar() {
  const emp = $('f-emp').value.trim(), venc = $('f-venc').value;
  if (!emp || !venc) return toast('Informe a empresa e o vencimento.', true);
  const cli = S.clientes.find(c => c.razao_social === emp);
  const linha = { empresa: emp, cliente_id: cli ? cli.id : (S.ed.cliente_id || null), tipo: $('f-tipo').value, vencimento: venc, descricao: $('f-desc').value.trim() || null,
    responsavel: $('f-resp').value.trim() || null, obs: $('f-obs').value.trim() || null, updated_at: new Date().toISOString() };
  const r = S.ed.id ? await sb.from('soc_vencimentos').update(linha).eq('id', S.ed.id) : await sb.from('soc_vencimentos').insert(linha);
  if (r.error) return toast(r.error.message, true);
  S.ed = null; await carregar(); render(); toast('Salvo.');
}
async function excluir(id) { if (!confirm('Excluir este vencimento?')) return; const r = await sb.from('soc_vencimentos').delete().eq('id', id); if (r.error) return toast(r.error.message, true); S.ed = null; await carregar(); render(); }
// Renovado: pergunta a nova data (certificado A1 = 1 ano; alvarás conforme a prefeitura)
async function renovar(id) {
  const v = S.itens.find(x => x.id === id);
  const sug = SO.addDias(v.vencimento > hojeISO() ? v.vencimento : hojeISO(), 365);
  const nova = prompt('Nova data de vencimento (dd/mm/aaaa):', dataBR(sug)); if (!nova) return;
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(nova.trim()); if (!m) return toast('Data inválida.', true);
  const r = await sb.from('soc_vencimentos').update({ vencimento: `${m[3]}-${m[2]}-${m[1]}`, obs: `Renovado em ${dataBR(hojeISO())}. ${v.obs || ''}`.trim(), updated_at: new Date().toISOString() }).eq('id', id);
  if (r.error) return toast(r.error.message, true); await carregar(); render(); toast('Vencimento atualizado.');
}

// Lê o certificado A1 aqui no navegador (o arquivo e a senha não saem do computador) e preenche o vencimento
async function lerCertificado(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  if (!window.forge) return toast('Leitor de certificado não carregou. Recarregue a página.', true);
  const senha = prompt('Senha do certificado (só para ler a validade; não é guardada):'); if (senha === null) return;
  try {
    const bin = forge.util.binary.raw.encode(new Uint8Array(await f.arrayBuffer()));
    const p12 = forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin), senha);
    const certs = (p12.getBags({ bagType: forge.pki.oids.certBag })[forge.pki.oids.certBag] || []).map(b => b.cert).filter(Boolean);
    const cert = certs.find(c => !(c.extensions || []).some(e => e.name === 'basicConstraints' && e.cA)) || certs[0];
    if (!cert) throw new Error('nenhum certificado no arquivo');
    const cn = (cert.subject.getField('CN') || {}).value || '';
    const [nome, doc] = cn.split(':');
    const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const cnpj = (doc || '').replace(/\D/g, '');
    const cli = S.clientes.find(c => (c.cnpj || '').replace(/\D/g, '') === cnpj) || S.clientes.find(c => c.razao_social && nome && c.razao_social.toUpperCase() === nome.toUpperCase());
    editar(null, { tipo: 'certificado_a1', empresa: cli ? cli.razao_social : nome, cliente_id: cli ? cli.id : null, vencimento: iso(cert.validity.notAfter),
      descricao: `${cnpj.length === 14 ? 'e-CNPJ' : 'e-CPF'} A1 — ${cn}`, obs: `Emitido em ${dataBR(iso(cert.validity.notBefore))}. Lido do arquivo ${f.name}.` });
    toast('Certificado lido: confira e salve.');
  } catch (e) { toast('Não foi possível ler: senha errada ou arquivo inválido (' + e.message + ').', true); }
}

(async () => { try { await carregar(); render(); } catch (e) { $('view').innerHTML = `<div class="card">Não foi possível carregar: ${esc(e.message)}</div>`; } })();
</script>
</body>
</html>
